<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>NodeFusion · rcore-ch5-exact</title>
<style>
/* NodeFusion 通用可视化前端样式。
   刻意保持信息密度：这是一个工程观测界面，不是宣传页。 */

:root {
  --bg: oklch(97% .006 215);
  --bg2: oklch(99% .004 215);
  --bg3: oklch(94% .008 215);
  --line: oklch(86% .012 215);
  --fg: oklch(25% .018 225);
  --fg2: oklch(42% .015 225);
  --fg3: oklch(54% .012 225);
  --accent: oklch(48% .13 200);
  --ok: oklch(43% .12 150);
  --warn: oklch(48% .12 75);
  --err: oklch(48% .17 25);
  --purple: oklch(47% .13 305);
  --mono: ui-monospace, "Cascadia Code", "Consolas", "DejaVu Sans Mono", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 13px;
}

#app { display: flex; flex-direction: column; height: 100vh; }

/* ---------------------------------------------------------------- header */

header {
  background: var(--bg2); border-bottom: 1px solid var(--line);
  padding: 8px 14px; display: flex; align-items: center; gap: 16px;
  flex-wrap: wrap;
}
header h1 {
  margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .5px;
}
header h1 span { color: var(--accent); }
.hmeta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--fg2); font-size: 12px; }
.hmeta b { color: var(--fg); font-weight: 500; }

.badge {
  padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 600;
}
.badge.completed { background: rgba(63,185,80,.15); color: var(--ok); }
.badge.panic, .badge.boot_failed, .badge.qemu_error {
  background: rgba(248,81,73,.15); color: var(--err);
}
.badge.timeout, .badge.qemu_exited, .badge.unknown {
  background: rgba(210,153,34,.15); color: var(--warn);
}

/* ------------------------------------------------------------- capability */

.capability {
  background: rgba(210,153,34,.08); border-bottom: 1px solid var(--line);
  padding: 5px 14px; font-size: 12px; color: var(--warn);
  display: flex; align-items: center;
}
.capability.coverage-complete { background: rgba(63,185,80,.08); color: var(--ok); }
.capability details { width: 100%; }
.capability summary {
  cursor: pointer; list-style: none; display: flex; align-items: center;
  justify-content: space-between; gap: 12px;
}
.capability summary::-webkit-details-marker { display: none; }
.capability .cap-headline { font-weight: 600; }
.capability .cap-more { color: var(--fg3); font-size: 11px; font-weight: 400; }
.capability ul { margin: 3px 0 0 16px; padding: 0; color: var(--fg2); }
.capability li { margin: 3px 0; overflow-wrap: anywhere; }
.inline-disclosure summary { cursor: pointer; color: var(--fg2); }
.inline-disclosure .disclosure-body { margin-top: 5px; color: var(--fg3); }

/* ------------------------------------------------------------------ time */

.timebar {
  background: var(--bg2); border-bottom: 1px solid var(--line);
  padding: 7px 14px; display: flex; align-items: center; gap: 10px;
}
.timebar button {
  background: var(--bg3); border: 1px solid var(--line); color: var(--fg);
  border-radius: 4px; padding: 3px 10px; cursor: pointer; font-size: 12px;
}
.timebar button:hover { border-color: var(--accent); color: var(--accent); }
.timebar input[type=range] { flex: 1; accent-color: var(--accent); }
.tlabel { font-family: var(--mono); font-size: 12px; color: var(--fg2); white-space: nowrap; }
.tlabel b { color: var(--fg); }

#minimap { width: 100%; height: 34px; display: block; cursor: pointer; }
.minimapwrap { background: var(--bg2); border-bottom: 1px solid var(--line); padding: 0 14px 6px; }

/* ------------------------------------------------------------------ body */

.main { flex: 1; display: flex; min-height: 0; }
.left { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.right {
  width: 380px; border-left: 1px solid var(--line); background: var(--bg2);
  overflow: auto; padding: 10px 12px; flex-shrink: 0;
}

nav.tabs {
  display: flex; gap: 2px; background: var(--bg2);
  border-bottom: 1px solid var(--line); padding: 0 8px;
}
nav.tabs button {
  background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--fg2); padding: 7px 12px; cursor: pointer; font-size: 12.5px;
}
nav.tabs button.on { color: var(--fg); border-bottom-color: var(--accent); }

.panel { flex: 1; overflow: auto; padding: 12px 14px; display: none; }
.panel.on { display: block; }

/* ----------------------------------------------------------------- cards */

.cards { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.card {
  background: var(--bg2); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 12px; min-width: 116px;
}
.card .v { font-size: 18px; font-family: var(--mono); }
.card .l { font-size: 11px; color: var(--fg3); margin-top: 2px; }
.card .s { font-size: 11px; color: var(--fg3); margin-top: 3px;
  font-family: var(--mono); white-space: nowrap; }

h3 { font-size: 13px; margin: 16px 0 7px; color: var(--fg); font-weight: 600; }
h3:first-child { margin-top: 0; }
.hint { color: var(--fg3); font-size: 11.5px; margin: 4px 0 8px; line-height: 1.5; }
/* 挨着数字的次要说明（比如抽样类别的"实际 57～14592"）。压暗是要的：
   它是个区间，不该跟旁边那个精确计数抢同样的分量。 */
.dim { color: var(--fg3); font-size: 11px; }

/* ---------------------------------------------------------------- tables */

table { border-collapse: collapse; width: 100%; font-size: 12px; }
th {
  text-align: left; color: var(--fg3); font-weight: 500; padding: 4px 8px;
  border-bottom: 1px solid var(--line); position: sticky; top: 0;
  background: var(--bg); white-space: nowrap;
}
td { padding: 3px 8px; border-bottom: 1px solid rgba(42,49,64,.5); }
td.mono, th.mono { font-family: var(--mono); }
tr.sel td { background: rgba(74,163,255,.15); }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: rgba(255,255,255,.04); }

.tag {
  display: inline-block; padding: 1px 6px; border-radius: 3px;
  font-size: 10.5px; font-family: var(--mono);
}
.st-RUNNING  { background: rgba(63,185,80,.18);  color: var(--ok); }
.st-RUNNABLE { background: rgba(74,163,255,.18); color: var(--accent); }
.st-SLEEPING { background: rgba(163,113,247,.18); color: var(--purple); }
.st-ZOMBIE   { background: rgba(248,81,73,.18);  color: var(--err); }
.st-USED, .st-UNUSED { background: rgba(107,119,132,.18); color: var(--fg3); }

/* 三态里那两个"没有数"的态。**它们必须跟"有数是 0"看着不一样** —— 一个是
   量出来的 0，一个是压根没量。都灰，但灰得不一样：挂上没响的还是正文色系
   （它是这趟的事实），声明没有的整行压到 fg3（它跟这趟无关）。 */
tr.k-silent td:first-child { color: var(--fg2); }
tr.k-absent  td { color: var(--fg3); }
.tag.why-empty       { background: rgba(107,119,132,.18); color: var(--fg2); }
.tag.why-feature     { background: rgba(210,153,34,.15);  color: var(--warn); }
.tag.why-granularity { background: rgba(163,113,247,.18); color: var(--purple); }

.unknown { color: var(--warn); font-style: italic; }

/* 字段状态。三种情况值都是 null，但**必须长得不一样**：
     absent       这个内核没有这个字段  —— 内核的性质，正常
     empty        字段在，这一刻是空    —— 这一刻的值，正常
     undecodable  本该有却没读出来      —— 我们的故障，要显眼
   混成同一个 '—' 的话，"rCore 没有 chan"和"解码挂了"在屏幕上就是同一句话。 */
.fs-absent      { background: rgba(107,119,132,.18); color: var(--fg3); }
.fs-empty       { background: rgba(107,119,132,.10); color: var(--fg3); font-style: italic; }
.fs-undecodable { background: rgba(210,153,34,.18);  color: var(--warn); }

/* 角色：跨内核通用的那几个概念。字段名各内核不同，角色是同一个。 */
.role { margin-left: 5px; font-size: 9.5px; color: var(--accent); opacity: .8; }

/* ------------------------------------------------------------ phys memory */

#physcanvas {
  image-rendering: pixelated; border: 1px solid var(--line);
  background: #05070a; cursor: crosshair; max-width: 100%;
}
.legend { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; font-size: 11.5px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }

/* ---------------------------------------------------------------- events */

.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.filters input, .filters select {
  background: var(--bg3); border: 1px solid var(--line); color: var(--fg);
  border-radius: 4px; padding: 3px 7px; font-size: 12px;
}
.filters input[type=text] { min-width: 190px; }
#evscroll { height: calc(100vh - 300px); overflow: auto; border: 1px solid var(--line); border-radius: 5px; }

/* ---------------------------------------------------------------- detail */

.dsec { margin-bottom: 14px; }
.dsec .t { font-size: 11px; color: var(--fg3); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 5px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
.kv .k { color: var(--fg3); white-space: nowrap; }
.kv .v { font-family: var(--mono); word-break: break-all; }
.delta.up { color: var(--ok); }
.delta.down { color: var(--err); }

pre.console {
  background: #05070a; border: 1px solid var(--line); border-radius: 5px;
  padding: 10px; font-family: var(--mono); font-size: 12px; color: var(--fg2);
  white-space: pre-wrap; word-break: break-all; max-height: 70vh; overflow: auto;
}

canvas.chart { width: 100%; height: 130px; display: block; background: var(--bg2);
  border: 1px solid var(--line); border-radius: 5px; margin-bottom: 10px; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 10px; margin: -2px 0 5px; color: var(--fg2); font: 10px var(--mono); }
.chart-legend i { display: inline-block; width: 8px; height: 8px; margin-right: 4px; border-radius: 50%; }

/* --------------------------------------------------------------- compare */

.cmp { display: flex; gap: 10px; }
.cmp > div { flex: 1; min-width: 0; }
.cmphead {
  background: var(--bg3); border: 1px solid var(--line); border-radius: 5px;
  padding: 6px 10px; margin-bottom: 8px; font-size: 12px;
}
.cmpdiff { color: var(--accent); font-family: var(--mono); }

.err-box {
  background: rgba(248,81,73,.1); border: 1px solid var(--err);
  border-radius: 6px; padding: 12px; color: var(--err); margin: 20px;
}


/* ------------------------------------------------- 物理内存图的坐标与图例 */
/*
 * 原来这张图是一片没有坐标的方块，谁也看不出哪里是哪里。
 * 左边补一列物理地址刻度之后，"内核镜像在最上面、用户页在高地址"
 * 这种结构才真正看得见。
 */
.physwrap { position: relative; padding-left: 86px; margin-bottom: 8px; }
.physwrap canvas {
  /* 128 行 × 256 列的原始比例是 2:1，铺满宽度会有 590px 高，
     加上图例就把主角挤出屏幕了。这里非等比压扁：格子变成矮长方形，
     但"一格 = 一页"的对应关系不变，整张图反而更容易一眼扫完。 */
  width: 100%; height: 360px; display: block; image-rendering: pixelated;
  border: 1px solid var(--line); border-radius: 4px; background: #05070a;
}
.physaxis { position: absolute; left: 0; top: 0; bottom: 0; width: 82px; }
.physaxis .atick {
  position: absolute; right: 6px; transform: translateY(-50%);
  font-family: var(--mono); font-size: 10px; color: var(--fg3);
  white-space: nowrap;
}
.physaxis .atick::after {
  content: ''; position: absolute; right: -6px; top: 50%;
  width: 4px; height: 1px; background: var(--line);
}

.legend2 {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
  gap: 2px 12px; margin: 6px 0 8px;
}
.legend2 .lgitem { display: flex; gap: 6px; align-items: flex-start; font-size: 11.5px; }
.legend2 .lgitem i {
  width: 11px; height: 11px; border-radius: 2px; flex: none; margin-top: 3px;
  border: 1px solid rgba(255,255,255,.18);
}
.legend2 .lgitem b { color: var(--fg); font-weight: 600; }
.legend2 .lgdef { color: var(--fg3); display: block; line-height: 1.3; font-size: 11px; }

/* 变化摘要条 */
.deltabar {
  margin: 0 10px 8px; padding: 7px 12px; font-size: 12px;
  background: var(--bg2); border: 1px solid var(--line);
  border-radius: 5px;
  color: var(--fg2); font-family: var(--mono);
}
.deltabar b { color: var(--fg); }
.deltabar .up { color: var(--ok); }
.deltabar .down { color: var(--err); }

.physopt { font-size: 12px; color: var(--fg2); margin: 4px 0 6px;
  display: flex; align-items: center; gap: 6px; }
.physopt label { cursor: pointer; }
.physaxis .atick.gap { color: #6e7681; font-size: 9px; font-style: italic; }

/* Investigation workspace */
body { font-size: 13px; }
button, input, select { font: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible,
tr.clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { transition: background-color .16s ease-out, color .16s ease-out, border-color .16s ease-out; }
.topbar {
  min-height: 64px; padding: 10px 20px; gap: 16px;
  background: var(--bg2);
}
.brand-lockup { display: flex; align-items: center; gap: 10px; flex: none; }
.brand-mark {
  display: grid; place-items: center; width: 36px; height: 36px;
  background: var(--fg); color: var(--bg2); border-radius: 6px;
  font-family: var(--mono); font-size: 13px; font-weight: 700;
}
.brand-name { font-size: 16px; font-weight: 750; line-height: 1.1; }
.brand-name span { color: var(--accent); }
.brand-kicker { margin-top: 3px; color: var(--fg3); font-size: 10px; }
.hmeta { flex: 1; min-width: 0; gap: 5px 16px; align-items: center; }
.hmeta > div { white-space: nowrap; }
.hmeta > div:nth-child(n+6) { display: none; }
.badge { border-radius: 4px; white-space: nowrap; }
.top-action, .secondary-control, .ghost-control {
  border: 1px solid var(--line); border-radius: 5px; background: var(--bg2);
  color: var(--fg); padding: 7px 11px; cursor: pointer; white-space: nowrap;
}
.top-action:hover, .secondary-control:hover, .ghost-control:hover { border-color: var(--accent); color: var(--accent); }
.capability { padding: 5px 20px; }
.timebar { padding: 10px 20px 7px; gap: 18px; background: var(--bg2); }
.transport { display: flex; gap: 4px; flex: none; }
.timebar button { min-height: 32px; padding: 5px 10px; font-weight: 600; }
.timebar .primary-control { background: var(--fg); color: var(--bg2); border-color: var(--fg); min-width: 58px; }
.timebar .primary-control:hover { background: var(--accent); border-color: var(--accent); color: var(--bg2); }
.timebar input[type=range] { min-width: 80px; }
.tlabel { min-width: 270px; text-align: right; line-height: 1.5; }
.minimapwrap { padding: 0 20px 8px; }
.minimap-axis, .density-axis, .cpu-axis {
  display: flex; justify-content: space-between; color: var(--fg3);
  font: 10px var(--mono); line-height: 1.2;
}
.minimap-axis { padding: 2px 1px 0; }
.deltabar { margin: 0; padding: 7px 20px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; }
.main { background: var(--bg); }
.main.detail-collapsed .right { display: none; }
.main.detail-collapsed .left { flex: 1; }
nav.tabs {
  width: 182px; flex: none; display: flex; flex-direction: column; gap: 2px;
  padding: 18px 9px; border-bottom: 0; border-right: 1px solid var(--line);
  background: var(--bg2); overflow-y: auto;
}
nav.tabs button {
  width: 100%; min-height: 36px; text-align: left; padding: 7px 11px;
  border: 1px solid transparent; border-radius: 5px; font-size: 12px; font-weight: 550;
}
nav.tabs button:hover { background: var(--bg3); color: var(--fg); }
nav.tabs button.on { background: var(--bg3); border-color: var(--line); color: var(--fg); font-weight: 700; }
.panel { padding: 22px 24px 30px; }
.right { width: min(340px, 28vw); padding: 20px; background: var(--bg2); }
.cards { gap: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 8px 0 18px; }
.card { min-width: 150px; flex: 1 1 18%; padding: 14px 13px; border: 0; border-radius: 0; background: transparent; }
.card .v { font-size: 20px; color: var(--fg); font-weight: 700; }
.card .l { color: var(--fg2); font-size: 11px; }
.card .s { white-space: normal; overflow-wrap: anywhere; }
h3 { margin: 22px 0 9px; font-size: 14px; }
.hint { color: var(--fg2); }
th { padding: 9px 10px; background: var(--bg); color: var(--fg2); font-weight: 650; }
td { padding: 8px 10px; border-bottom-color: var(--line); }
tr.clickable:hover td { background: var(--bg3); }
tr.sel td { background: color-mix(in oklch, var(--accent) 12%, var(--bg)); }
.section-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
.section-heading h2 { margin: 0 0 4px; font-size: 20px; line-height: 1.2; }
.section-subtitle { color: var(--fg2); font-size: 12px; }
.shortcut-hint { color: var(--fg3); font-family: var(--mono); font-size: 11px; white-space: nowrap; }
.event-filters {
  display: grid; grid-template-columns: minmax(190px, 2fr) repeat(2, minmax(140px, 1fr)) minmax(82px, .55fr);
  gap: 10px; align-items: end; margin: 0 0 14px;
}
.filter-control { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.filter-label { font-size: 11px; font-weight: 650; color: var(--fg2); }
.filters input, .filters select {
  width: 100%; height: 34px; min-width: 0; padding: 6px 9px;
  background: var(--bg2); border-color: var(--line); border-radius: 5px; color: var(--fg);
}
.filters input[type=text] { min-width: 0; }
.filter-control:focus-within .filter-label { color: var(--accent); }
.range-control { grid-column: span 1; }
.event-filters > button { height: 34px; }
.range-presets { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin: -2px 0 15px; color: var(--fg3); font-size: 11px; }
.range-presets > span { margin-right: 5px; font-weight: 650; }
.range-preset { padding: 4px 8px; border: 1px solid transparent; border-radius: 5px; background: transparent; color: var(--fg2); cursor: pointer; }
.range-preset:hover { background: var(--bg3); color: var(--fg); }
.range-preset.selected { border-color: var(--line); background: var(--bg2); color: var(--accent); font-weight: 650; }
.result-bar { display: flex; align-items: center; gap: 4px; margin: 0 0 10px; color: var(--fg2); }
.result-bar strong { color: var(--fg); font-size: 14px; }
.result-active { margin-left: 8px; color: var(--accent); font-size: 11px; }
.event-facets { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 11px; margin-bottom: 3px; }
.facet {
  display: inline-flex; align-items: center; gap: 9px; flex: none; height: 28px;
  padding: 4px 8px; background: var(--bg2); border: 1px solid var(--line);
  border-radius: 5px; color: var(--fg2); cursor: pointer; font-family: var(--mono); font-size: 11px;
}
.facet b { color: var(--fg3); font-weight: 500; }
.facet:hover, .facet.selected { color: var(--accent); border-color: var(--accent); background: color-mix(in oklch, var(--accent) 8%, var(--bg2)); }
.event-density { margin: 5px 0 14px; padding: 9px 10px 7px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg2); }
.density-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.density-label { color: var(--fg2); font-size: 10px; font-weight: 650; }
.density-meta { color: var(--fg3); font: 10px var(--mono); white-space: nowrap; }
.density-bars { display: flex; align-items: end; gap: 2px; height: 34px; }
.density-bar { flex: 1; min-width: 2px; height: 4px; padding: 0; border: 0; border-radius: 2px 2px 0 0; background: color-mix(in oklch, var(--accent) 55%, var(--bg3)); cursor: pointer; }
.density-bar:hover { background: var(--accent); }
.density-axis { padding-top: 4px; }
#evscroll { height: calc(100vh - 430px); min-height: 230px; border-radius: 5px; background: var(--bg2); }
.event-table { table-layout: auto; white-space: nowrap; }
.event-table th { background: var(--bg2); }
.event-table td { height: 34px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
.event-table tbody > tr:first-child td, .event-table tbody > tr:last-child td { padding: 0; border: 0; }
.event-kind { color: var(--accent); font-family: var(--mono); font-weight: 600; }
.event-empty { padding: 42px 20px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg2); text-align: center; }
.event-empty strong { font-size: 14px; }
.event-empty p { margin: 7px 0 0; color: var(--fg2); }
.right .dsec .t { color: var(--fg2); font-weight: 700; }
.detail-empty { padding: 28px 10px; color: var(--fg2); }
.detail-empty-icon { display: grid; place-items: center; width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 6px; color: var(--accent); font-size: 21px; }
.detail-empty h2 { color: var(--fg); font-size: 14px; margin: 16px 0 5px; }
.detail-empty p { max-width: 28ch; margin: 0; line-height: 1.55; }
.trace-controls { display: flex; gap: 8px; margin: 0 0 16px; }
.trace-controls input, .trace-controls select { height: 34px; min-width: 150px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg2); color: var(--fg); }
.trace-controls input { flex: 1; min-width: 220px; }
.trace-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; min-height: 420px; }
.trace-panel { min-width: 0; border-top: 1px solid var(--line); background: var(--bg2); padding: 14px; }
.trace-panel-title { font-size: 13px; font-weight: 700; }
.trace-panel-note { color: var(--fg2); font-size: 11px; margin: 4px 0 12px; }
.function-tree, .function-sequence { max-height: calc(100vh - 400px); min-height: 290px; overflow: auto; }
.function-row { position: relative; display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 32px; padding: 6px 8px; border: 0; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, color-mix(in oklch, var(--accent) 10%, transparent) var(--bar), transparent var(--bar)); color: var(--fg); text-align: left; cursor: pointer; }
.function-row:hover { background-color: var(--bg3); }
.function-name, .sequence-function { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 11px; }
.stack-chain .function-name { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; }
.function-count, .sequence-meta { flex: none; margin-left: 10px; color: var(--fg2); font-family: var(--mono); font-size: 11px; }
.sequence-link { width: 1px; height: 10px; margin-left: 18px; background: var(--line); }
.sequence-node { display: grid; grid-template-columns: 25px minmax(0, 1fr); gap: 4px 8px; width: 100%; padding: 7px 8px; border: 1px solid transparent; border-radius: 5px; background: transparent; color: var(--fg); text-align: left; cursor: pointer; }
.sequence-node:hover { border-color: var(--line); background: var(--bg3); }
.sequence-index { grid-row: span 2; color: var(--accent); font-family: var(--mono); font-size: 10px; }
.sequence-meta { margin-left: 0; font-size: 10px; }
.trace-muted { padding: 28px 8px; color: var(--fg2); font-size: 12px; }
.cpu-axis { margin: 2px 0 12px 40px; }
.physwrap canvas, #physcanvas, pre.console { background: oklch(16% .012 225); }
.err-box { background: color-mix(in oklch, var(--err) 8%, var(--bg2)); }
@media (max-width: 1180px) {
  .right { width: 290px; }
  nav.tabs { width: 158px; }
  .event-filters { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .filter-search { grid-column: span 2; }
}
@media (max-width: 850px) {
  #app { min-height: 100vh; height: auto; }
  .topbar { padding: 10px 14px; }
  .hmeta { order: 3; flex-basis: 100%; }
  .top-action { margin-left: auto; }
  .timebar { flex-wrap: wrap; gap: 8px; padding: 9px 14px; }
  .timebar input[type=range] { order: 3; flex-basis: 100%; min-width: 0; width: 100%; }
  .tlabel { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .minimapwrap { padding: 0 14px 8px; }
  .main { flex-direction: column; }
  nav.tabs { width: 100%; flex-direction: row; padding: 5px 10px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  nav.tabs button { width: auto; white-space: nowrap; flex: none; }
  .left { min-height: 500px; }
  .panel { padding: 18px 14px; min-height: 460px; }
  .right { width: 100%; max-height: 340px; border-left: 0; border-top: 1px solid var(--line); padding: 14px; }
  .main.detail-collapsed .right { display: none; }
  #evscroll { height: 54vh; }
  .trace-grid { grid-template-columns: 1fr; }
  .function-tree, .function-sequence { max-height: 42vh; }
}
@media (max-width: 560px) {
  .brand-kicker, .shortcut-hint { display: none; }
  .hmeta > div:nth-child(n+4) { display: none; }
  nav.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); overflow: visible; gap: 2px; }
  nav.tabs button { white-space: normal; text-align: center; line-height: 1.25; padding: 7px 3px; }
  .timebar .transport { width: 100%; }
  .transport button { flex: 1; }
  .tlabel { text-align: left; order: 2; }
  .event-filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .filter-search { grid-column: span 2; }
  .trace-controls { flex-wrap: wrap; }
  .trace-controls input { flex-basis: 100%; min-width: 0; }
  .trace-controls select { flex: 1; min-width: 0; }
  .section-heading h2 { font-size: 17px; }
  .card { flex-basis: 45%; min-width: 0; }
  .physwrap { padding-left: 62px; }
  .physaxis { width: 58px; }
}
@media (prefers-reduced-motion: reduce) { button { transition: none; } }

</style>
</head>
<body>
<div id="loading" style="padding:40px;color:#9aa7b5;font-family:system-ui">
  正在解压运行记录…
</div>

<div id="app" style="display:none">
  <header class="topbar">
    <div class="brand-lockup">
      <div class="brand-mark" aria-hidden="true">NF</div>
      <div>
        <div class="brand-name">Node<span>Fusion</span></div>
        <div class="brand-kicker">运行观测报告</div>
      </div>
    </div>
    <span id="outcome" class="badge"></span>
    <div class="hmeta" id="hmeta"></div>
    <button id="quick-events" class="top-action" type="button" title="打开事件浏览器">事件浏览器</button>
    <button id="toggle-detail" class="top-action" type="button" title="切换检查点详情">收起详情</button>
  </header>

  <div class="capability" id="capability" style="display:none"></div>

  <div class="timebar" aria-label="时间控制">
    <div class="transport">
      <button id="prev" type="button" title="上一快照">上一帧</button>
      <button id="play" type="button" class="primary-control">播放</button>
      <button id="next" type="button" title="下一快照">下一帧</button>
    </div>
    <input type="range" id="slider" min="0" value="0">
    <span class="tlabel" id="tlabel"></span>
  </div>
  <div class="minimapwrap">
    <canvas id="minimap"></canvas>
    <div class="minimap-axis" aria-hidden="true"><span id="mini-start">0</span><span id="mini-end">—</span></div>
  </div>

  <!-- 变化摘要条：只回答"相对上一个快照，这一刻有什么变了"。
       全部是从两个快照相减得到的纯事实，不含任何对实验意图的猜测。 -->
  <div class="deltabar" id="deltabar" style="display:none"></div>

  <div class="main">
    <nav class="tabs" aria-label="报告章节">
        <button data-tab="compare">对比</button>
        <button data-tab="overview" class="on">概览</button>
        <button data-tab="phys">物理内存</button>
        <button data-tab="procs">进程与调度</button>
        <button data-tab="vm">虚拟内存与页表</button>
        <button data-tab="fs">文件系统与磁盘</button>
        <button data-tab="events">事件</button>
        <button data-tab="functions">函数轨迹</button>
        <button data-tab="metrics">指标</button>
        <button data-tab="console">控制台</button>
    </nav>
    <div class="left">
      <div class="panel on" id="panel-overview"></div>
      <div class="panel" id="panel-phys"></div>
      <div class="panel" id="panel-procs"></div>
      <div class="panel" id="panel-vm"></div>
      <div class="panel" id="panel-fs"></div>
      <div class="panel" id="panel-events"></div>
      <div class="panel" id="panel-functions"></div>
      <div class="panel" id="panel-metrics"></div>
      <div class="panel" id="panel-console"></div>
      <div class="panel" id="panel-compare"></div>
    </div>
    <div class="right">
      <div id="detail">
        <div class="detail-empty">
          <div class="detail-empty-icon" aria-hidden="true">⌖</div>
          <h2>检查点详情</h2>
          <p>选择事件、进程或物理页，查看当前时间点的关联数据。</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/*
 * NodeFusion 通用可视化前端。
 *
 * 这一层刻意对"实验"一无所知：它不知道什么是写时复制、什么是 Stride 调度、
 * 什么是日志提交。它只认识数据包里的四样东西 —— 时间轴（指令号）、事件、
 * 状态快照、指标。所以换一个程序、换一个内核、换一个实验，前端一行都不用改。
 *
 * 两条核心观察路径（对应项目要求）：
 *   1. 按时间：拖动时间轴定位到某个指令/tick，看那一刻整个系统的状态。
 *   2. 按事件：在事件表里定位某次 syscall / trap / 中断 / 上下文切换 /
 *      睡眠唤醒 / 缺页 / kalloc / 页表修改 / 文件系统 / 磁盘事件，
 *      看它前后发生了什么、涉及哪些资源、造成了什么变化。
 *
 * 凡是外部观测拿不到的信息，一律显示成"未知（缺少 guest 语义）"，不编造。
 */

'use strict';

const NF = {
  runs: [],          // 一个或两个数据包（第二个用于对比）
  cur: 0,            // 当前时间：指令号
  playing: false,
  speed: 260,        // 播放时每帧停留毫秒数（录屏可用 ?speed= 调）
  loop: false,
  detailOpen: true,
  tab: 'overview',
  selEvent: null,
  selPage: null,
  selPid: null,
  filters: { text: '', kind: '', res: '', pid: '', cpu: '', group: '', from: '', to: '' },
};

/* ------------------------------------------------------------------ 工具 */

const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, cls, txt) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
};
const shortText = (value, limit = 160) => {
  const text = String(value || '').replace(/\s+/g, ' ').trim();
  return text.length > limit ? `${text.slice(0, limit - 1)}…` : text;
};
/* 64 位的地址和寄存器值放不进 JS 的 double。打包侧（bundle.py 的 _js_safe）
   已经把这类值发成 "0x…" 字符串了 —— 因为一旦它们以 JSON 数字的形式进来，
   `JSON.parse` 当场就把值改了，前端再格式化也是错的。
   所以这两个函数都要认字符串：原样显示，不做任何数值转换。 */
const EXACT_MAX = Number.MAX_SAFE_INTEGER;   // 2^53 - 1
const isHexStr = (n) => typeof n === 'string' && n.startsWith('0x');

const hex = (n) => {
  if (n === null || n === undefined) return '—';
  if (isHexStr(n)) return n;
  return '0x' + Number(n).toString(16);
};

const num = (n) => {
  if (n === null || n === undefined) return '—';
  // 十六进制字符串就是"大到十进制表示不精确"的那些值，照原样给。
  if (isHexStr(n)) return n;
  const v = Number(n);
  if (!Number.isFinite(v)) return '—';
  if (Math.abs(v) > EXACT_MAX) return '0x' + v.toString(16);
  return v.toLocaleString('en-US');
};

/* 整数照原样显示，取不到就是 '—'。
   跟 num() 的分工：num() 会加千位分隔符（1234 -> "1,234"），指令号、字节数
   那种大数该那样显示；pid、槽号、页数不该。
   跟 String() 的分工：String(null) 是 "null"，String(undefined) 是
   "undefined" —— 两个都会当成值印在表格里。pid 是可以为 null 的
   （ProcInfo.pid: int | None），所以这不是假想的情况。 */
const plain = (n) => ((n === null || n === undefined) ? '—' : String(n));

function fmtInsn(n) {
  if (n === null || n === undefined) return '—';
  return num(n);
}

async function inflateB64(b64) {
  const bin = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  if (typeof DecompressionStream === 'undefined') {
    throw new Error('这个浏览器不支持 DecompressionStream，请用较新的 Chrome / Edge / Firefox 打开');
  }
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate'));
  const buf = await new Response(stream).arrayBuffer();
  return JSON.parse(new TextDecoder().decode(buf));
}

/* ------------------------------------------------------- 状态与事件检索 */

// 找到 insn 时刻之前（含）最近的一次状态快照
function stateIndexAt(run, insn) {
  const s = run.states;
  if (!s.length) return -1;
  let lo = 0, hi = s.length - 1, best = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (s[mid].insn <= insn) { best = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  return best;
}
function stateAt(run, insn) {
  const i = stateIndexAt(run, insn);
  return i >= 0 ? run.states[i] : null;
}

function eventIndexAt(run, insn) {
  const a = run.events.insn;
  let lo = 0, hi = a.length - 1, best = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (a[mid] <= insn) { best = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  return best;
}

function evGet(run, i) {
  const E = run.events, D = run.dict;
  return {
    i, insn: E.insn[i], cpu: E.cpu[i],
    kind: D.kinds[E.kind[i]], res: D.res[E.res[i]],
    pid: E.pid[i] < 0 ? null : E.pid[i],
    pc: E.pc[i], func: D.funcs[E.func[i]],
    stack: E.stack?.[i]?.map((id) => D.funcs[id]) || null,
    tick: E.tick[i] < 0 ? null : E.tick[i],
    detail: E.detail[i], unknown: E.unknown[i],
  };
}

function eventGroup(kind) {
  if (/^(syscall|sbi)\./.test(kind)) return '系统调用';
  if (/^(trap|interrupt|firmware)\./.test(kind)) return '异常与中断';
  if (/^(disk|bcache|inode|log)\./.test(kind)) return '文件与 I/O';
  if (/^(phys|pagetable|vm)\./.test(kind)) return '内存与页表';
  if (/^(sched|proc|sync)\./.test(kind)) return '进程与同步';
  if (/^func\./.test(kind)) return '函数入口';
  return '其他';
}

/* ------------------------------------------------------------ 物理内存图 */

// 归属类别配色。用户页在此基础上按 pid 微调色相，让不同进程一眼可分。
const KIND_COLOR = {
  0: [22, 27, 34],     // free
  1: [70, 78, 92],     // kernel-image
  2: [104, 116, 136],  // kernel-other
  3: [74, 163, 255],   // user
  4: [210, 153, 34],   // pagetable
  5: [163, 113, 247],  // trapframe
  6: [86, 122, 180],   // kstack
  7: [63, 185, 80],    // user-shared（COW 的典型形态）
  8: [40, 46, 58],     // unknown
};
const KIND_LABEL = {
  0: '空闲', 1: '内核镜像', 2: '内核动态', 3: '用户页',
  4: '页表页', 5: 'trapframe', 6: '内核栈', 7: '多进程共享', 8: '未知',
};

/*
 * 每一类归属"到底指什么"。这些是操作系统概念本身的定义，和这次跑的是什么
 * 程序、做的是哪个实验没有关系 —— 换句话说，它不会因为换个 workload 就说错。
 * 图例只给颜色和名字的话，没学过的人根本不知道自己在看什么。
 */
const KIND_DEF = {
  0: '未分配',
  1: '内核代码 / 静态数据',
  2: '内核运行时分配',
  3: '单进程用户页',
  4: '页表节点',
  5: 'trapframe',
  6: '内核栈',
  7: '多进程共享',
  8: '归属未知',
};

function pidTint(rgb, pid) {
  if (!pid) return rgb;
  const h = (pid * 2654435761) % 360;
  const f = 0.55 + 0.45 * (((h % 97) / 97));
  const g = 0.55 + 0.45 * (((h % 61) / 61));
  return [Math.min(255, rgb[0] * f), Math.min(255, rgb[1] * g), rgb[2]];
}

function expandPhys(state) {
  // 游程解码成两个平铺数组
  const total = state.total;
  const kind = new Uint8Array(total);
  const pid = new Int32Array(total);
  let p = 0;
  for (const [k, pd, n] of state.phys) {
    for (let i = 0; i < n && p < total; i++, p++) { kind[p] = k; pid[p] = pd; }
  }
  return { kind, pid };
}

/*
 * prevState 给的话，会把"相对上一个快照发生了变化的页"提亮。
 * 这是让静态一帧变得可读的关键：光看一屏方块看不出名堂，
 * 但"哪些格子刚刚变了"是任何运行、任何实验都成立的通用信息。
 * 返回变化的页数，供调用方显示。
 */
/*
 * 128 MiB 里往往只有很小一块真的在用（xv6 跑个小程序常常只占 3%），
 * 整张图铺开就是一片黑，什么也看不出来。这里把**连续全空闲的整行**折叠掉，
 * 只保留有内容的行，中间用一条分隔线表示"这里跳过了 N MiB 全空闲"。
 *
 * 关键是折叠的单位是"整行"，而一行恰好是 1 MiB，所以左边的物理地址刻度
 * 依然是准确的 —— 既看得清细节，也没有骗人。
 * 规则本身与跑什么程序无关：全空就折叠，有内容就保留。
 */
function physRowPlan(state, cols, prevState) {
  const rows = Math.ceil(state.total / cols);
  const { kind } = expandPhys(state);
  const prev = prevState && prevState.total === state.total
    ? expandPhys(prevState).kind : null;

  const busy = new Uint8Array(rows);
  for (let r = 0; r < rows; r++) {
    for (let i = r * cols; i < Math.min(state.total, (r + 1) * cols); i++) {
      // 本帧非空闲，或者上一帧非空闲（刚被释放的行也值得看见）
      if (kind[i] !== 0 || (prev && prev[i] !== 0)) { busy[r] = 1; break; }
    }
  }
  // 有内容的行前后各留一行余量，避免贴边看着突兀
  const keep = new Uint8Array(rows);
  for (let r = 0; r < rows; r++) {
    if (!busy[r]) continue;
    for (let d = -1; d <= 1; d++) { const q = r + d; if (q >= 0 && q < rows) keep[q] = 1; }
  }

  const plan = [];
  let r = 0;
  while (r < rows) {
    if (keep[r]) { plan.push({ type: 'data', r }); r++; continue; }
    let e = r;
    while (e < rows && !keep[e]) e++;
    // 只折叠够长的空段，省下来的高度才值得多一条分隔线
    if (e - r >= 3) { plan.push({ type: 'gap', from: r, to: e - 1 }); }
    else for (let q = r; q < e; q++) plan.push({ type: 'data', r: q });
    r = e;
  }
  return { plan, rows };
}

function drawPhys(canvas, state, highlightPid, prevState) {
  const cols = 256;
  const total = state.total;
  const { kind, pid } = expandPhys(state);
  const prev = prevState && prevState.total === total ? expandPhys(prevState) : null;

  // fold=false 时退化成"整块 128 MiB 全画"，两种视图共用同一段绘制逻辑
  const plan = canvas._nffold === false
    ? { plan: Array.from({ length: Math.ceil(total / cols) }, (_, r) => ({ type: 'data', r })) }
    : physRowPlan(state, cols, prevState);
  const lines = plan.plan;

  canvas.width = cols; canvas.height = lines.length;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(cols, lines.length);
  let changed = 0;

  for (let y = 0; y < lines.length; y++) {
    const ln = lines[y];
    if (ln.type === 'gap') {
      for (let x = 0; x < cols; x++) {
        const o = (y * cols + x) * 4;
        img.data[o] = 12; img.data[o + 1] = 14; img.data[o + 2] = 18; img.data[o + 3] = 255;
      }
      continue;
    }
    for (let x = 0; x < cols; x++) {
      const i = ln.r * cols + x;
      const o = (y * cols + x) * 4;
      if (i >= total) { img.data[o + 3] = 255; continue; }
      let c = KIND_COLOR[kind[i]] || KIND_COLOR[8];
      if (kind[i] === 3 || kind[i] === 7) c = pidTint(c, pid[i]);
      let dim = 1;
      if (highlightPid && pid[i] !== highlightPid && (kind[i] === 3 || kind[i] === 7)) dim = 0.35;
      else if (highlightPid && kind[i] !== 3 && kind[i] !== 7) dim = 0.4;
      let r = c[0] * dim, g = c[1] * dim, b = c[2] * dim;
      if (prev && (prev.kind[i] !== kind[i] || prev.pid[i] !== pid[i])) {
        changed++;
        /*
         * 变化标记要分方向，否则一次大规模释放会把半张图拉成灰白，
         * 反而看不出剩下的页各自是什么。
         *   刚被占用 → 往白拉一点（保留原色相，还认得出变成了什么）
         *   刚被释放 → 压成暗红（贴近空闲的深色，只是留个"这里刚空出来"的痕迹）
         */
        if (kind[i] === 0) { r = 74; g = 32; b = 36; }
        else { r += (255 - r) * 0.38; g += (255 - g) * 0.38; b += (255 - b) * 0.38; }
      }
      img.data[o] = r; img.data[o + 1] = g; img.data[o + 2] = b; img.data[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  // 点击要能从"屏幕上第几行"反推回"物理内存第几页"，所以把行计划一起存下来
  canvas._nfphys = { kind, pid, cols, total, lines };
  return changed;
}

/* ---------------------------------------------------------------- 小地图 */

function drawMinimap(run) {
  const c = $('#minimap');
  const w = c.clientWidth || 900, h = 34;
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#161b22'; ctx.fillRect(0, 0, w, h);
  const total = run.meta.total_insns || 1;

  // 事件密度直方图
  const bins = new Uint32Array(w);
  const E = run.events.insn;
  for (let i = 0; i < E.length; i++) {
    const x = Math.min(w - 1, Math.floor((E[i] / total) * w));
    bins[x]++;
  }
  let max = 1;
  for (const v of bins) if (v > max) max = v;
  ctx.fillStyle = '#2d4f7c';
  for (let x = 0; x < w; x++) {
    const hgt = Math.round((bins[x] / max) * (h - 8));
    if (hgt > 0) ctx.fillRect(x, h - hgt - 4, 1, hgt);
  }

  // 快照刻度
  ctx.fillStyle = '#3fb950';
  for (const s of run.states) {
    const x = Math.floor((s.insn / total) * w);
    ctx.fillRect(x, 0, 1, 4);
  }

  // 关键事件标注（panic / 缺页 / 上下文切换）
  const marks = { 'kernel.panic': '#f85149', 'trap.page_fault': '#d29922' };
  for (let i = 0; i < E.length; i++) {
    const k = run.dict.kinds[run.events.kind[i]];
    const col = marks[k];
    if (col) {
      const x = Math.floor((E[i] / total) * w);
      ctx.fillStyle = col; ctx.fillRect(x, h - 4, 1, 4);
    }
  }

  // 目标程序开始执行的分界线（由校准跑测出的最后一次 exec）
  const ps = run.meta.program_start_insn;
  if (ps) {
    const x = Math.floor((ps / total) * w);
    ctx.fillStyle = '#a371f7';
    ctx.fillRect(x, 0, 1, h);
    ctx.fillStyle = '#a371f7'; ctx.font = '9px sans-serif';
    ctx.fillText('程序开始', Math.min(w - 48, x + 3), 10);
  }

  // 播放头
  const px = Math.floor((NF.cur / total) * w);
  ctx.fillStyle = '#4aa3ff';
  ctx.fillRect(px, 0, 1, h);
}

/* ---------------------------------------------------------------- 折线图 */

function axisNum(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return '—';
  const a = Math.abs(n);
  if (a >= 1e9) return `${(n / 1e9).toFixed(a >= 1e10 ? 0 : 1)}G`;
  if (a >= 1e6) return `${(n / 1e6).toFixed(a >= 1e7 ? 0 : 1)}M`;
  if (a >= 1e3) return `${(n / 1e3).toFixed(a >= 1e4 ? 0 : 1)}K`;
  return Number.isInteger(n) ? n.toLocaleString('en-US') : n.toFixed(1);
}

function drawChart(canvas, series, opts) {
  opts = opts || {};
  const w = canvas.clientWidth || 600, h = canvas.clientHeight || 130;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#161b22'; ctx.fillRect(0, 0, w, h);
  const margin = { left: 52, right: 12, top: 22, bottom: 25 };
  const plotW = Math.max(10, w - margin.left - margin.right);
  const plotH = Math.max(10, h - margin.top - margin.bottom);
  let maxY = 0;
  const okPt = (p) => p && p[1] !== null && p[1] !== undefined && Number.isFinite(Number(p[1]));
  for (const s of series) for (const p of s.points) {
    if (okPt(p)) maxY = Math.max(maxY, Number(p[1]));
  }
  maxY = Math.max(1, maxY);
  const minX = Number.isFinite(Number(opts.xMin)) ? Number(opts.xMin) : 0;
  const fallbackX = Math.max(...series.flatMap((s) => s.points.filter((p) => p && p[0] !== null).map((p) => Number(p[0]))), 1);
  const maxX = Number.isFinite(Number(opts.xMax)) ? Number(opts.xMax) : fallbackX;
  const spanX = Math.max(1, maxX - minX);
  const xPos = (x) => margin.left + ((Number(x) - minX) / spanX) * plotW;
  const yPos = (y) => margin.top + plotH - (Number(y) / maxY) * plotH;

  ctx.font = '10px monospace';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#8b98a8';
  ctx.textAlign = 'left';
  ctx.fillText(opts.title || '', margin.left, 10);
  ctx.textAlign = 'right';
  ctx.fillText(`峰值 ${axisNum(maxY)}`, w - margin.right, 10);

  ctx.strokeStyle = '#2a3140'; ctx.lineWidth = 1;
  ctx.fillStyle = '#8b98a8';
  for (let i = 0; i <= 4; i++) {
    const y = margin.top + (plotH * i) / 4;
    ctx.beginPath(); ctx.moveTo(margin.left, y); ctx.lineTo(w - margin.right, y); ctx.stroke();
    ctx.textAlign = 'right'; ctx.fillText(axisNum(maxY * (1 - i / 4)), margin.left - 7, y);
  }
  for (let i = 0; i <= 4; i++) {
    const x = margin.left + (plotW * i) / 4;
    ctx.beginPath(); ctx.moveTo(x, margin.top); ctx.lineTo(x, margin.top + plotH); ctx.stroke();
    ctx.textAlign = i === 0 ? 'left' : i === 4 ? 'right' : 'center';
    ctx.fillText(axisNum(minX + (spanX * i) / 4), x, h - 12);
  }
  ctx.strokeStyle = '#657384';
  ctx.beginPath(); ctx.moveTo(margin.left, margin.top); ctx.lineTo(margin.left, margin.top + plotH);
  ctx.lineTo(w - margin.right, margin.top + plotH); ctx.stroke();

  for (const s of series) {
    ctx.strokeStyle = s.color; ctx.lineWidth = 1.5; ctx.beginPath();
    let pen = false;
    for (const p of s.points) {
      if (!okPt(p)) { pen = false; continue; }
      const x = xPos(p[0]);
      const y = yPos(p[1]);
      if (x < margin.left || x > w - margin.right) { pen = false; continue; }
      pen ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      pen = true;
    }
    ctx.stroke();
  }
  const px = xPos(NF.cur);
  if (px >= margin.left && px <= w - margin.right) {
    ctx.strokeStyle = '#4aa3ff'; ctx.lineWidth = 1; ctx.beginPath();
    ctx.moveTo(px, margin.top); ctx.lineTo(px, margin.top + plotH); ctx.stroke();
  }
}

function renderCapability() {
  const run = NF.runs[0];
  const c = run.meta.capability;
  const box = $('#capability');
  const items = [];
  const compact = (value, limit = 140) => shortText(value, limit);
  items.push(c.nftrace_records
    ? `内核语义：${num(c.nftrace_records)} 条 nftrace`
    : '内核语义：未启用 nftrace');
  if (c.missing_watch_functions && c.missing_watch_functions.length) {
    const names = c.missing_watch_functions.slice(0, 4).join('、');
    items.push(`缺少观察点：${num(c.missing_watch_functions.length)} 个${names ? `（${names}${c.missing_watch_functions.length > 4 ? '…' : ''}）` : ''}`);
  }
  if (c.missing_layout_fields && c.missing_layout_fields.length) {
    items.push(`缺少字段：${num(c.missing_layout_fields.length)} 个`);
  }
  if (c.trace_truncated_at_eof) items.push('轨迹在结尾截断');
  if (c.plugin_truncated) items.push('物理内存快照在结尾截断');
  if (run.meta.event_selection && run.meta.event_selection.dropped) {
    const s = run.meta.event_selection;
    items.push(`事件流：${num(s.retained)} / ${num(s.raw)} 条（${s.policy} 抽样）`);
  }
  for (const [kind, d] of Object.entries(c.absent_declared || {})) {
    const why = d.why === 'feature' ? '内核没有这项功能' : '内核有该行为但缺少所需观测粒度';
    items.push(`${kind}：${why}`);
  }
  for (const n of run.meta.notes || []) items.push(compact(n));
  for (const wn of run.meta.warnings || []) items.push(`告警 @${fmtInsn(wn.insn)}：${compact(wn.text)}`);

  const cov = c.coverage || null;
  const metric = cov && cov.metrics;
  const complete = cov && cov.status === 'complete';
  const headline = cov
    ? (complete
        ? `100% 可适用覆盖 · 指标 ${metric.covered}/${metric.applicable}`
        : `覆盖未完整 ${num(cov.percent)}% · 指标 ${metric.covered}/${metric.applicable} · `
          + `${num((cov.blockers || []).length)} 类待解决`)
    : '观测能力';

  box.style.display = 'flex';
  box.className = 'capability ' + (complete ? 'coverage-complete' : 'coverage-incomplete');
  box.innerHTML = '';

  const summary = el('summary');
  summary.appendChild(el('span', 'cap-headline', headline));
  summary.appendChild(el('span', 'cap-more', '详情'));
  disclosure.appendChild(summary);
  const ul = el('ul');
  for (const t of items) ul.appendChild(el('li', null, t));
  if (cov && cov.blockers && cov.blockers.length) {
    ul.appendChild(el('li', null, '机器审计未通过：' +
      cov.blockers.map((b) => b.check).join('、')));
  }
  disclosure.appendChild(ul);
  box.appendChild(disclosure);
}

    c.appendChild(el('div', 'l', l));
    if (s) c.appendChild(el('div', 's', s));
    cards.appendChild(c);

   * 光看"缺页异常 38,243"没人判断得了这是多还是少，但"平均每 21.6 万条指令一次"

   * `sampling.metrics` 就是拿它跟观察点上的 rate 交出来的结果。
   */
  const smet = (m.sampling || {}).metrics || {};

    const r = smet[name];
    if (!r || !r.length) return '';
    const hi = r.filter((x) => x > 1);
    // 同一类挂了好几个观察点、限流还不一样，那这个数既不是全量也不是干净的
    // 1/N，只能说"部分"。
    return r.some((x) => x <= 1) ? ` · 1/${hi.join('、1/')}`
                                 : ` · 1/${hi.join('、1/')}`;
  };
  /*
   * 每个累计数都配一条"平均多久发生一次"。
   * 光看"缺页异常 38,243"没人判断得了这是多还是少，但"平均每 21.6 万条指令一次"
   * 是个能直接感受的密度。分母是总指令数，任何运行都有，不需要知道跑的是什么。
   *
   * 抽样过的那些不给密度。分子少了 N 倍，除出来的密度就稀了 N 倍 ——
   * "平均每 21M 条指令一次 kalloc"是个具体、好记、错了两个数量级的印象。
   * 乘回去也不行：N 是上限不是实测（末尾不足 N 次的余数直接丢），
   * 那样得出的是估算，不是量出来的。
   */
  const hiRate = (name) => {
    const r = smet[name];
    if (!r || !r.length) return 0;
    const hi = Math.max(...r);
    return hi > 1 ? hi : 0;
  };
  const rate = (n, name) => {
    // 抽样过的不给密度，给区间。密度是拿计数当分子算的，分子少了 N 倍，
    // 算出来的"平均每 21M 条指令一次"就是个具体、好记、错两个数量级的印象。
    const hi = name ? hiRate(name) : 0;
    if (hi) return `实际 ${num(n)}～${num(n * hi)} 次`;
    if (!n || !m.total_insns) return '';
    const per = m.total_insns / n;
    const fmt = per >= 1e6 ? (per / 1e6).toFixed(1) + 'M'
              : per >= 1e3 ? (per / 1e3).toFixed(1) + 'K' : per.toFixed(0);
    return `平均每 ${fmt} 条指令一次`;
  };
  card(fmtInsn(m.total_insns), '总指令数', '运行全程');
  card(num(m.syscalls), '系统调用', rate(m.syscalls));
  card(num(m.page_faults), '缺页异常', rate(m.page_faults));
  card(num(m.context_switches), '上下文切换' + tagOf('context_switches'),
       rate(m.context_switches, 'context_switches'));
  card(num(m.timer_interrupts + m.external_interrupts), '中断',
       `时钟 ${m.timer_interrupts} / 设备 ${m.external_interrupts}`);
  // JS 里 null - null === 0，直接相减会把"两个都测不到"变成"净分配 0 页"，
  // 那是编出来的数。任一侧不可观测，差值就没有意义。
  //
  // 抽样过的那一侧同理，而且更阴（#154）：`kalloc 57 / kfree 53` 两个都是
  // 1/256 抽样，差出来的 4 不是"净分配 4 页"—— 真实净值大约是它的 256 倍，
  // 而两个独立抽样的差本身就是噪声，256 倍之后噪声也跟着放大。数字看着小、
  // 精确、可信，结论却是错的，比显示"未知"糟得多。
  const ka = hiRate('kalloc'), kf = hiRate('kfree');
  const netUnknown =
    (m.kalloc === null || m.kfree === null) ? '净分配未知（没有观测点）'
    : (ka || kf)
      ? `样本 ${num(m.kalloc)}～${num(m.kalloc * (ka || 1))}`
        + ` / ${num(m.kfree)}～${num(m.kfree * (kf || 1))}`
    : `净 ${num(m.kalloc - m.kfree)} 页`;
  card(num(m.kalloc) + ' / ' + num(m.kfree), 'kalloc / kfree' + tagOf('kalloc'),
       netUnknown);
  card(num(m.disk_io), '磁盘 I/O' + tagOf('disk_io'), rate(m.disk_io, 'disk_io'));
  // 命中率是 (缓存读 − 设备读) / 缓存读 —— 一个**差**除以一个数。两个分量各自
  // 抽样之后这个式子就废了，哪怕限流一样：
  //
  //   Starry 这趟缓存读记 3 条、设备读记 1 条；两边都是 1/64，`3 - 1`
  //   仍然不是两次命中。真实值落在两个区间里，不能由样本点相减得到。
  //
  // 比值"分子分母同除以 N 所以还在"那套说法只在数大的时候成立。这里不成立，
  // 而且不成立的时候恰好会给出一个特别像结论的数（0.0%）。所以只要有一侧
  // 抽样过就不给百分比 —— 这是三态里的"测不准"，跟"测出来是 0"不一样。
  const hrSampled = !!(smet.bcache_reads || smet.disk_io);
  const hrSub = hrSampled ? '样本不可合并' : `${num(m.bcache_hits)} / ${num(m.bcache_reads)} 次读`;
  card((m.bcache_hit_rate === null || hrSampled)
         ? '—' : (m.bcache_hit_rate * 100).toFixed(1) + '%',
       '缓存命中率', hrSub);
  // 映射分两档，**按粒度不按内核**：区域级一次调用映一段（xv6 mappages、
  // ArceOS Backend::map），页级一次调用写一个 PTE（rCore PageTable::map）。
  // 两档以前共用一张卡片，于是 76583 和 32318 并排摆着看，而那是「映射了
  // 多少段」对「写了多少个 PTE」。标题得把粒度写出来，不然分开也白分。
  // 这几张卡的副标题是**粒度说明**不是密度，所以区间得另外接上去，不能走
  // `rate()`（那个是拿副标题的位置说密度的）。
  const withRange = (sub, n, name) => {
    const hi = hiRate(name);
    if (!hi || n === null || n === undefined) return sub;
    const r = `实际 ${num(n)}～${num(n * hi)} 次`;
    return sub ? `${sub} · ${r}` : r;
  };
  card(num(m.vm_maps), '映射区域' + tagOf('vm_maps'),
       withRange('一次 / 段', m.vm_maps, 'vm_maps'));
  card(num(m.page_table_maps), '页表项' + tagOf('page_table_maps'),
       withRange('一次 / PTE', m.page_table_maps, 'page_table_maps'));
  card(num(m.log_commits), '日志提交' + tagOf('log_commits'),
       withRange('', m.log_commits, 'log_commits'));
  p.appendChild(cards);

  p.appendChild(el('div', 'hint', '缓存命中率：bread 次数 − 磁盘 I/O，外部推导。'));

  // 上面若干张卡片显示 "—"，是因为这个内核里压根没有对应的函数可挂观测点。
  // 不写清楚的话，"—" 和 "0" 在读者眼里都是"没发生"，而这两件事完全不同。
  if (m.unobservable_reason) {
    const d = el('details', 'inline-disclosure hint');
    d.appendChild(el('summary', null, '指标不可用'));
    d.appendChild(el('div', 'disclosure-body', shortText(m.unobservable_reason, 90)));
    p.appendChild(d);
  }

  // 当前时刻的系统概况
  p.appendChild(el('h3', null, '当前时刻的系统状态'));
  if (!st) {
    p.appendChild(el('div', 'hint', '此时刻无物理内存快照。'));
  } else {
    const g = el('div', 'cards');
    const c2 = (v, l) => {
      const c = el('div', 'card');
      c.appendChild(el('div', 'v', v)); c.appendChild(el('div', 'l', l));
      g.appendChild(c);
    };
    c2(num(st.free), '空闲物理页');
    c2(num(st.used), '已用物理页');
    c2(num(st.shared), '多进程共享页');
    // 进程表解不出来时这三项是"不知道"，不是 0。num(null) 会显示 "—"。
    const pOk = st.procs_ok !== false;
    const psum = (f) => (pOk ? st.procs.reduce((a, x) => a + f(x), 0) : null);
    c2(num(pOk ? st.procs.length : null), '活动进程');
    c2(num(psum((x) => x.user_pages)), '用户页合计');
    c2(num(psum((x) => x.cow_pages)), 'COW 标记页');
    p.appendChild(g);
    p.appendChild(renderProcTable(run, st));   // 解不出来时它自己会给出说明
  }

  p.appendChild(el('h3', null, '各核在执行什么'));
  p.appendChild(renderCpuLanes(run));
}

function renderProcTable(run, st) {
  // 解不出进程表时给一句明确的话。空表格会被读成"当前没有进程"，
  // 那是个结论；这里没有结论。
  if (st.procs_ok === false) {
    return el('div', 'err-box',
      '进程表不可用 · ' + shortText(st.procs_reason || '未知原因', 110));
  }
  // 列分两段。
  //
  // **结构列**是解码器自己算出来的，不在任何一份 manifest 里：slot 是它在数组
  // 里的下标，三个页数是**走页表数出来的**。每个内核都有，写死在这里是对的。
  // pid / 名字 / 状态也放这一段 —— 它们的来源是 manifest 字段，但解码器已经
  // 按 role（id / name / state）把它们认出来并归一化过了，下游一直用的是归一
  // 化后的那个值（比如 arceos 的 state 读出来是 2，state_name 才是名字）。
  //
  // **字段列**从 `p.fields` 来，也就是 manifest 里声明了什么就显示什么。以前
  // 这里写死的是 xv6 那 14 列，于是 rCore 上 chan / 优先级 / stride / pass 四
  // 列恒为 '—'（它没有这些东西），同时它自己的 base / children / trapcx 一列
  // 都看不到；而 xv6 自己的 killed / kstack / cwd / has_mail 也从来没露过面。
  const structural = [
    ['slot', (p) => plain(p.slot), 'mono'],
    ['pid', (p) => plain(p.pid), null],
  ];
  // 名字这一列跟着数据走。rCore 的 TaskControlBlock 里没有名字这个字段（进程
  // 叫什么写在 ELF 里，不在 TCB 里），整列都是 '—' —— 那一列什么也没说。
  if (st.procs.some((p) => run.dict.names[p.name])) {
    structural.push(['名字', (p) => run.dict.names[p.name] || '—', null]);
  }
  // 父进程用**解出来的 pid**，不是指针。下面的字段列里还会有一个 `parent`
  // （xv6 是 ptr，rCore 是 option<weak>），那是内核里存的原样；这一列是
  // NodeFusion 顺着它查到的是哪个进程。两个都留着：前者是事实，后者是结论。
  if (st.procs.some((p) => p.parent_pid !== null && p.parent_pid !== undefined)) {
    structural.push(['父进程', (p) => plain(p.parent_pid), null]);
  }
  const cols = [];
  // 字段列的顺序 = manifest 里的声明顺序（JSON 对象保序）。取并集是因为同一
  // 趟里不同进程可能少几个字段（读失败），少的那个不该把整列吃掉。
  const seen = new Map();
  for (const p of st.procs) {
    for (const k of Object.keys(p.fields || {})) {
      if (!seen.has(k)) seen.set(k, p.fields[k].role || null);
    }
  }
  // role 已经在结构列里露过面的字段不再重复一列（xv6 的 pid、rCore 的 status）。
  const shownRoles = new Set(['id', 'name', 'state']);
  const fieldKeys = [...seen.keys()].filter((k) => !shownRoles.has(seen.get(k)));

  // 整列都是 absent 的，说明这个内核压根没有这个字段 —— 少一列，并把原因写在
  // 表下面。空着一列比少一列更糟：读的人分不清"没有这个概念"和"这次没读到"。
  const dropped = [];
  const live = [];
  for (const k of fieldKeys) {
    const states = st.procs.map((p) => (p.fields || {})[k]).filter(Boolean);
    if (states.length && states.every((f) => f.state === 'absent')) {
      const why = states.find((f) => f.reason)?.reason || '未说明原因';
      dropped.push(`${k}：${why}`);
    } else {
      live.push(k);
    }
  }

  const t = el('table');
  const head = el('tr');
  for (const [label] of structural) head.appendChild(el('th', null, label));
  head.appendChild(el('th', null, '状态'));
  for (const lbl of ['用户页', 'COW 页', '页表页']) {
    head.appendChild(el('th', null, lbl));
  }
  for (const k of live) head.appendChild(el('th', null, k));
  t.appendChild(head);

  for (const p of st.procs) {
    const tr = el('tr', 'clickable');
    if (NF.selPid === p.pid) tr.className += ' sel';
    const td = (v, cls) => { tr.appendChild(el('td', cls, v)); };
    for (const [, get, cls] of structural) td(get(p), cls);
    const s = el('td');
    s.appendChild(el('span', 'tag st-' + p.state_name, p.state_name));
    tr.appendChild(s);
    td(plain(p.user_pages), 'mono');
    td(plain(p.cow_pages), 'mono');
    td(plain(p.pt_pages), 'mono');
    for (const k of live) tr.appendChild(fieldTd((p.fields || {})[k]));
    tr.onclick = () => {
      NF.selPid = NF.selPid === p.pid ? null : p.pid;
      render(); showProcDetail(run, st, p);
    };
    t.appendChild(tr);
  }

  if (!fieldKeys.length && st.procs.length) {
    // 老解码器不发 fields。那时候只剩结构列，说一句，别让人以为这个内核的
    // 进程只有这么点信息。
    const box = el('div');
    box.appendChild(t);
    box.appendChild(el('div', 'hint', '旧格式：仅显示通用字段。'));
    return box;
  }
  if (dropped.length) {
    const box = el('div');
    box.appendChild(t);
    const d = el('details', 'inline-disclosure hint');
    d.appendChild(el('summary', null, `未显示的可选字段（${dropped.length}）`));
    d.appendChild(el('div', 'disclosure-body',
      dropped.map((item) => item.split('：')[0]).join('、') + '：当前内核未提供'));
    box.appendChild(d);
    return box;
  }
  return t;
}

/* manifest 字段的一格（连 <td> 一起造，因为 absent 那种要挂 title）。
   `state` 有三种，显示上必须分得开：
     present —— 读到了，按 reader 决定怎么印
     empty   —— 读到了，是空的（空指针 / None）。印 '（空）'，不是 '—'
     absent  —— 这个内核没有这个字段。印 '—'，鼠标停上去是 manifest 给的原因
   把后两种都印成 '—' 的话，"这里没有东西"和"我们没看到"就混成了一句话。 */
function fieldTd(f) {
  if (!f) return el('td', 'mono', '—');
  if (f.state === 'absent') {
    const d = el('td', 'mono', '—');
    if (f.reason) d.title = f.reason;
    return d;
  }
  if (f.state === 'empty') return el('td', 'mono', '（空）');
  const v = f.value;
  if (v === null || v === undefined) return el('td', 'mono', '—');
  if (Array.isArray(v)) {
    const n = v.filter((x) => x !== null && x !== undefined).length;
    const d = el('td', 'mono', n ? `${n} 项` : '（空）');
    d.title = JSON.stringify(v);
    return d;
  }
  // 指针类按十六进制。用 reader 和 role 判断，不猜数值大小 —— 大小是个坏判据：
  // xv6 的 sz 也能到几十万，那不是地址。
  //
  // role 那半边是必要的：rCore 的 task_cx 读法是 `struct`（读出来的是这个结构
  // 体的地址），reader 上看不出它是地址，可 role = sched_context 说得很清楚。
  // 少了这一条它会印成 2,183,300,240 —— 一个加了千位分隔符的地址。
  const r = f.reader || '';
  const ADDR_ROLES = ['sched_context', 'trap_context', 'address_space_root'];
  if (/ptr|ppn|addr/.test(r) || ADDR_ROLES.includes(f.role)) {
    return el('td', 'mono', typeof v === 'number' ? hex(v) : String(v));
  }
  if (typeof v === 'number') return el('td', 'mono', num(v));
  return el('td', 'mono', String(v));
}

function renderCpuLanes(run) {
  const wrap = el('div');
  const total = run.meta.total_insns || 1;
  const ncpu = run.meta.cpus;
  const S = run.samples;
  for (let c = 0; c < ncpu; c++) {
    const cv = el('canvas', 'chart');
    cv.style.height = '26px';
    wrap.appendChild(el('div', 'hint', `CPU ${c} · 用户 / 内核 / 无采样`));
    wrap.appendChild(cv);
    setTimeout(() => {
      const w = cv.clientWidth || 600, h = 26;
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#1c2230'; ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < S.insn.length; i++) {
        if (S.cpu[i] !== c) continue;
        const x = Math.floor((S.insn[i] / total) * w);
        ctx.fillStyle = S.priv[i] === 0 ? '#3fb950' : '#4aa3ff';
        ctx.fillRect(x, 2, 1, h - 4);
      }
      const px = Math.floor((NF.cur / total) * w);
      ctx.fillStyle = 'oklch(98% .005 215)'; ctx.fillRect(px, 0, 1, h);
    }, 0);
  }
  const axis = el('div', 'cpu-axis');
  axis.appendChild(el('span', null, '0'));
  axis.appendChild(el('span', null, axisNum(total / 2)));
  axis.appendChild(el('span', null, axisNum(total)));
  wrap.appendChild(axis);
  return wrap;
}

function renderPhys() {
  const run = NF.runs[0];
  const p = $('#panel-phys');
  p.innerHTML = '';
  const st = stateAt(run, NF.cur);
  if (!st) { p.appendChild(el('div', 'hint', '该时刻没有物理内存快照。')); return; }
  if (!st.phys_ok) {
    p.appendChild(el('div', 'err-box',
      '物理内存不可用 · ' + shortText(st.phys_reason || '未知原因', 110)));
  }

  const base = run.meta.ram_base || 0x80000000;
  const psz = run.meta.page_size || 4096;
  const cols = 256;                       // 每行 256 页
  const rowBytes = cols * psz;            // 每行正好 1 MiB —— 这让地址刻度变得好读
  const rows = Math.ceil(st.total / cols);

  p.appendChild(el('div', 'hint',
    `每格 ${psz / 1024} KiB · ${num(st.total)} 页 · ${rowBytes / 1048576} MiB / 行 · 点击查看页详情` +
    (st.pt_root_src === 'observed-satp' ? ' · 地址空间来自 satp 观测' : '') +
    (!st.pt_root_src ? ' · 未观测到页表根' : '') +
    (st.phys_reason ? ` · ${shortText(st.phys_reason, 120)}` : '')));

  // 图例：颜色 + 名字 + 这个名字到底指什么。术语解释是操作系统概念本身，
  // 和这次跑的是什么程序无关，所以放在这里是安全的。
  const legend = el('div', 'legend2');
  for (const k of [0, 1, 2, 3, 7, 4, 5, 6, 8]) {
    const s = el('div', 'lgitem');
    const i = el('i'); const c = KIND_COLOR[k];
    i.style.background = `rgb(${c[0]},${c[1]},${c[2]})`;
    s.appendChild(i);
    const t = el('div');
    t.appendChild(el('b', null, KIND_LABEL[k]));
    t.appendChild(el('span', 'lgdef', KIND_DEF[k] || ''));
    s.appendChild(t);
    legend.appendChild(s);
  }
  p.appendChild(legend);

  // 折叠开关：默认折叠掉全空闲的整行，否则小程序在 128 MiB 里根本看不见
  const bar = el('div', 'physopt');
  const cb = el('input'); cb.type = 'checkbox'; cb.id = 'foldchk';
  cb.checked = NF.foldPhys !== false;
  cb.onchange = () => { NF.foldPhys = cb.checked; renderPhys(); };
  const lb = el('label'); lb.htmlFor = 'foldchk';
  lb.textContent = '折叠全空闲区域（只看真正在用的内存）';
  bar.appendChild(cb); bar.appendChild(lb);
  p.appendChild(bar);

  // 画布 + 左侧地址刻度。刻度做成 HTML 而不是画进 canvas：
  // canvas 是 256×N 的原始像素再被 CSS 拉伸的，在上面画字会糊成一团。
  const wrap = el('div', 'physwrap');
  const axis = el('div', 'physaxis');
  const cv = el('canvas'); cv.id = 'physcanvas';
  cv._nffold = NF.foldPhys !== false;
  wrap.appendChild(axis);
  wrap.appendChild(cv);
  p.appendChild(wrap);

  // 和上一个快照比：变了的页会被提亮，这样一眼能看出"刚刚哪里动了"
  const si = stateIndexAt(run, NF.cur);
  const prevSt = si > 0 ? run.states[si - 1] : null;
  const changed = drawPhys(cv, st, NF.selPid, prevSt);

  // 地址刻度跟着实际画出来的行走：每个连续数据段的开头标一次，
  // 折叠段标出跳过了多少。这样刻度在两种视图下都是准的。
  const lines = cv._nfphys.lines;
  /*
   * 间距要按"屏幕上隔了几行"算，不能按"物理地址差了多少"算：
   * 折叠之后一行可能只有几个像素高，两个标签会直接叠在一起（踩过）。
   * 折叠标记优先显示（不标就不知道跳过了多少），地址标签给它让位。
   */
  const minRows = Math.max(2, Math.ceil(lines.length / 14));
  let lastY = -999;
  for (let y = 0; y < lines.length; y++) {
    const ln = lines[y];
    const top = ((y + 0.5) / lines.length * 100) + '%';
    if (ln.type === 'gap') {
      const g = el('div', 'atick gap',
        `⋯ ${(ln.to - ln.from + 1) * rowBytes / 1048576} MiB 全空闲 ⋯`);
      g.style.top = top; axis.appendChild(g); lastY = y;
      continue;
    }
    if (y - lastY < minRows) continue;
    lastY = y;
    const lab = el('div', 'atick', '0x' + (base + ln.r * rowBytes).toString(16));
    lab.style.top = top; axis.appendChild(lab);
  }

  cv.onclick = (e) => {
    const r = cv.getBoundingClientRect();
    const x = Math.floor(((e.clientX - r.left) / r.width) * cv.width);
    const y = Math.floor(((e.clientY - r.top) / r.height) * cv.height);
    const ln = lines[y];
    if (!ln || ln.type !== 'data') return;      // 点在折叠分隔线上，没有对应的页
    const idx = ln.r * cv.width + x;
    if (idx >= 0 && idx < st.total) { NF.selPage = idx; showPageDetail(run, st, idx); }
  };

  const folded = lines.filter((l) => l.type === 'gap')
                      .reduce((a, l) => a + (l.to - l.from + 1), 0);
  p.appendChild(el('div', 'hint',
    (prevSt ? `变化页 ${num(changed)}` : '') +
    (folded ? ` · 折叠空闲 ${folded} 行` : '')));

  // 卡片：每个绝对数都配一个参照系，否则"31,763"这种数字没法判断大小
  const g = el('div', 'cards');
  const c2 = (v, l, sub) => {
    const c = el('div', 'card');
    c.appendChild(el('div', 'v', v));
    c.appendChild(el('div', 'l', l));
    if (sub) c.appendChild(el('div', 's', sub));
    g.appendChild(c);
  };
  const pct = (x) => ((x / st.total) * 100).toFixed(1) + '%';
  // 单位自适应：11 页写成 "0.0 MiB" 等于没说，小量要退回 KiB
  const mib = (x) => {
    const k = x * psz / 1024;
    return k >= 1024 ? (k / 1024).toFixed(1) + ' MiB' : num(k) + ' KiB';
  };
  // 数值为 null 表示这一项本次拿不到（比如没有空闲链表就不知道空闲页数）。
  // 这时候连参照系一起换成说明，绝不能让 pct/mib 算出 NaN 冒充一个数。
  const why = (reason) => shortText(reason || '未确定', 60);
  c2(num(st.used), '已用物理页',
     st.used === null ? why(st.phys_reason)
                      : `${pct(st.used)}　${mib(st.used)}` + deltaStr(prevSt, st, 'used'));
  c2(num(st.free), '空闲物理页',
     st.free === null ? why(st.phys_reason) : `${pct(st.free)}　${mib(st.free)}`);
  c2(num(st.shared), '多进程共享页',
     st.shared === null ? why(st.procs_reason)
     : st.shared ? `${pct(st.shared)}　${mib(st.shared)}`
                 : '0 页共享');
  c2(num(st.total), '物理页总数', `${mib(st.total)}　每页 ${psz / 1024} KiB`);
  p.appendChild(g);
}

// 相对上一个快照的变化量。纯减法，不解释含义。
function deltaStr(prev, cur, field) {
  if (!prev) return '';
  // 任一端拿不到就没有差值可言 —— null 参与减法会算出 NaN
  if (prev[field] === null || cur[field] === null) return '';
  const d = cur[field] - prev[field];
  if (!d) return '　Δ 0';
  return `　Δ ${d > 0 ? '+' : ''}${num(d)}`;
}

function renderProcs() {
  const run = NF.runs[0];
  const p = $('#panel-procs');
  p.innerHTML = '';
  const st = stateAt(run, NF.cur);
  if (!st) { p.appendChild(el('div', 'hint', '该时刻没有快照。')); return; }

  p.appendChild(el('h3', null, '进程表'));
  p.appendChild(renderProcTable(run, st));

  p.appendChild(el('h3', null, '各核当前进程'));
  if (!st.cpus.length) {
    // 空表配一排 xv6 的表头（push_off 深度 / 中断使能）是在暗示"这些量存在，
    // 只是这一刻没有" —— 而 rCore 和 ArceOS 根本没有 xv6 那个 per-CPU 结构。
    // 一行都没有的时候就别画表。
    p.appendChild(el('div', 'hint', '未重建 per-CPU 运行表。'));
  } else {
    const t = el('table');
    const hr = el('tr');
    ['CPU', 'pid', '进程', 'push_off 深度', '中断使能'].forEach((h) => hr.appendChild(el('th', null, h)));
    t.appendChild(hr);
    for (const c of st.cpus) {
      const tr = el('tr');
      tr.appendChild(el('td', null, String(c.cpu)));
      tr.appendChild(el('td', null, c.pid === null ? '（调度器）' : String(c.pid)));
      tr.appendChild(el('td', null, run.dict.names[c.name] || '—'));
      // num() 认 null 也认 undefined。String(c.noff) 在读不到时会印出 "null"，
      // 那看着像个值。
      tr.appendChild(el('td', 'mono', num(c.noff)));
      tr.appendChild(el('td', 'mono', num(c.intena)));
      t.appendChild(tr);
    }
    p.appendChild(t);
  }

  // 等待与同步：谁睡在哪个 chan 上。
  //
  // 'SLEEPING' 是 **xv6 的**状态名。rCore 的状态叫 Ready / Running / Zombie，
  // ArceOS 的又是另一套，两边都永远匹配不上，于是这一栏对它们恒定地说
  // "当前没有进程处于睡眠状态" —— 那是一句**关于内核的断言**，而且没有任何
  // 观测支持它：我们不是量到没人睡，是压根没在这个内核的词汇里找过。
  const sleepers = st.procs.filter((x) => x.state_name === 'SLEEPING');
  const states = [...new Set(st.procs.map((x) => x.state_name).filter(Boolean))];
  const hasSleepState = states.includes('SLEEPING');
  p.appendChild(el('h3', null, '等待与同步关系'));
  if (!hasSleepState && st.procs.length) {
    p.appendChild(el('div', 'hint', `当前内核未提供 xv6 chan 字段（状态：${states.join('、')}）。`));
  } else if (!sleepers.length) {
    p.appendChild(el('div', 'hint', '当前没有进程处于睡眠状态。'));
  } else {
    const byChan = {};
    for (const s of sleepers) (byChan[s.chan] = byChan[s.chan] || []).push(s);
    const t2 = el('table');
    const h2 = el('tr');
    ['等待通道 (chan)', '睡在上面的进程', '最近一次对该通道的 wakeup'].forEach((h) => h2.appendChild(el('th', null, h)));
    t2.appendChild(h2);
    for (const [chan, list] of Object.entries(byChan)) {
      const tr = el('tr');
      tr.appendChild(el('td', 'mono', hex(Number(chan))));
      tr.appendChild(el('td', null, list.map((x) => `${run.dict.names[x.name]}(${x.pid})`).join('、')));
      // 在事件流里回溯最近一次 wakeup(chan)
      let found = '—';
      const upto = eventIndexAt(run, NF.cur);
      for (let i = upto; i >= 0 && i > upto - 20000; i--) {
        const e = evGet(run, i);
        if (e.kind === 'sync.wakeup' && e.detail && String(e.detail.chan) === String(chan)) {
          found = `指令 ${fmtInsn(e.insn)}`; break;
        }
      }
      tr.appendChild(el('td', 'mono', found));
      t2.appendChild(tr);
    }
    p.appendChild(t2);
  }
}

  t.appendChild(hr);
  const perms = (fl) => {
    let s = '';

    s += (fl & 8) ? 'X' : '-'; s += (fl & 16) ? 'U' : '-';

  };

    const tr = el('tr', 'clickable');
    tr.appendChild(el('td', 'mono', hex(va)));
    tr.appendChild(el('td', 'mono', hex(pa)));
    tr.appendChild(el('td', 'mono', String(Math.floor((pa - 0x80000000) / 4096))));
    tr.appendChild(el('td', 'mono', perms(fl)));

    else if (!(fl & 16)) note = '内核侧映射（trampoline / trapframe）';
    tr.appendChild(el('td', null, note));
    tr.onclick = () => {
      const idx = Math.floor((pa - 0x80000000) / 4096);
      NF.selPage = idx; showPageDetail(run, st, idx);
    };
    t.appendChild(tr);
  }
  p.appendChild(t);
}

function renderFs() {
  const run = NF.runs[0];
  const p = $('#panel-fs');
  p.innerHTML = '';
  const st = stateAt(run, NF.cur);
  if (!st) { p.appendChild(el('div', 'hint', '该时刻没有快照。')); return; }

  const section = (title, res, cols, rowfn, emptyText) => {
    p.appendChild(el('h3', null, title));
    if (!res.ok) {
      p.appendChild(el('div', 'err-box', '资源不可用 · ' + shortText(res.reason, 110)));
      return;
    }
    if (!res.rows.length) { p.appendChild(el('div', 'hint', shortText(emptyText))); return; }
    const t = el('table'); const hr = el('tr');
    cols.forEach((c) => hr.appendChild(el('th', null, c)));
    t.appendChild(hr);
    for (const r of res.rows) {
      const tr = el('tr');
      for (const v of rowfn(r)) tr.appendChild(el('td', 'mono', v));
      t.appendChild(tr);
    }
    p.appendChild(t);
  };

  // 一格怎么显示由 manifest 的 format 说了算，不由列名猜。以前这三张表的
  // 每一格都写死在下面：`r.valid ? '是' : '否'`、`hex(r.inode)`、`num(r.size)`。
  // 换个内核就得在这里再加一段，而漏加不会报错 —— 只是少一张表。
  const cell = (v, c) => {
    if (v === null || v === undefined) return '—';   // 没读到，不是 0
    switch (c.format) {
      case 'bool': return v ? '是' : '否';
      case 'hex':  return hex(v);
      case 'num':  return num(v);
      default:     return String(v);
    }
  };

  // 资源表全部来自 st.resources —— 表名、列、顺序都在数据里，这里一个内核的
  // 名字都不出现。以前 xv6 的 bcache/ftable/itable 三张表的列名写死在这段
  // 代码里，第二个内核想显示自己的表就得再加一段。
  const resources = st.resources || [];
  if (!resources.length) {
    // 空有两种成因，结论相反：内核确实没有资源表，还是我们压根没去看。
    // 后端把原因带上来了，照发。
    p.appendChild(el('div', 'hint',
                     shortText(st.resources_reason || '该内核没有可显示的资源表。')));
  }
  for (const res of resources) {
    // show_when_any：默认只铺"在用"的行。这是**内核的判断**，写在 manifest
    // 里；界面照做，不自己拟规则。列表为空就全铺。
    const keys = res.show_when_any || [];
    const rows = keys.length
      ? (res.rows || []).filter((r) => keys.some((k) => r[k]))
      : (res.rows || []);
    section(res.label || res.name, { ok: res.ok, reason: res.reason, rows },
            (res.columns || []).map((c) => c.label),
            (r) => (res.columns || []).map((c) => cell(r[c.key], c)),
            res.empty || '当前没有内容。');
    // 少掉的可选列要说出来。默默少一列的话，读的人会以为这个内核就没这项。
    for (const n of res.notes || []) {
      p.appendChild(el('div', 'hint', shortText(n)));
    }
  }

  // 这个内核有没有"打开文件表"这个概念，看的是数据里有没有 fds，不是看内核
  // 叫什么名字。rCore 和 ArceOS 的 open_fds 是 null（ProcInfo 里就允许），
  // 一整张表全是 null 的时候画出来只有一列 '—'，不如说清楚为什么没有。
  const anyFds = st.procs.some((pr) => pr.fds);
  p.appendChild(el('h3', null, '每进程文件描述符'));
  if (!anyFds) {
    p.appendChild(el('div', 'hint', '未记录每进程 fd 表。'));
  } else {
    const t = el('table'); const hr = el('tr');
    ['进程', 'pid', '已打开的 fd'].forEach((h) => hr.appendChild(el('th', null, h)));
    t.appendChild(hr);
    for (const pr of st.procs) {
      const tr = el('tr');
      tr.appendChild(el('td', null, run.dict.names[pr.name]));
      tr.appendChild(el('td', null, plain(pr.pid)));
      // pr.fds 可以是 null —— 直接 .length 会抛 TypeError，把整个资源面板
      // 打断在半截（前面的资源表已经画出来了，后面的什么都没有，而且没有
      // 任何报错提示）。解不出来（'—'）和解出来是空的（'（无）'）要分开。
      tr.appendChild(el('td', 'mono',
        !pr.fds ? '—' : (pr.fds.length ? pr.fds.join(', ') : '（无）')));
      t.appendChild(tr);
    }
    p.appendChild(t);
  }
}

let evFiltered = [];

function applyFilters() {
  const run = NF.runs[0];
  const f = NF.filters;
  const n = run.events.insn.length;
  evFiltered = [];
  const txt = f.text.trim().toLowerCase();
  const from = f.from === '' ? null : Number(f.from);
  const to = f.to === '' ? null : Number(f.to);
  for (let i = 0; i < n; i++) {
    const insn = Number(run.events.insn[i]);
    if (from !== null && Number.isFinite(from) && insn < from) continue;
    if (to !== null && Number.isFinite(to) && insn > to) continue;
    const kind = run.dict.kinds[run.events.kind[i]];
    if (f.kind && kind !== f.kind) continue;
    if (f.group && eventGroup(kind) !== f.group) continue;
    if (f.res && run.dict.res[run.events.res[i]] !== f.res) continue;
    if (f.pid !== '' && String(run.events.pid[i]) !== f.pid) continue;
    if (f.cpu !== '' && String(run.events.cpu[i]) !== f.cpu) continue;
    if (txt) {
      const fn = run.dict.funcs[run.events.func[i]] || '';
      const d = run.events.detail[i];
      const hay = (kind + ' ' + (run.dict.res[run.events.res[i]] || '') + ' ' + fn + ' ' +
                   (d ? JSON.stringify(d) : '')).toLowerCase();
      if (hay.indexOf(txt) < 0) continue;
    }
    evFiltered.push(i);
  }
}

  const updateTextFilter = (key, input) => {
    const start = input.selectionStart, end = input.selectionEnd;

    NF.filterTimer = setTimeout(() => {
      renderEvents();
      const replacement = document.getElementById(input.id);
