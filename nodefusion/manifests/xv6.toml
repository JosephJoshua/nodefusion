piperead = { kind = "pipe.read", resource = "pipe" }
pipewrite = { kind = "pipe.write", resource = "pipe" }
pipeclose = { kind = "pipe.close", resource = "pipe" }
panic = { kind = "kernel.panic", args = ["msg"] }









#   name=fork         symbol=kfork          addr=0x80002ee6
#   name=usertrapret  symbol=prepare_return addr=0x80004082

kfork = "proc.fork"
kexit = "proc.exit"
kwait = "proc.wait"
kkill = "proc.kill"
kspawn = "proc.spawn"
kexec = "proc.exec"
prepare_return = "trap.userret"






[profile]
kernel_elf   = "kernel/kernel"
kernel_image = "kernel/kernel"



build = "make clean >/dev/null 2>&1; make {mv} -j8 kernel/kernel fs.img 2>&1 | tail -20"

detect_files   = ["kernel/proc.h", "kernel/param.h"]
required_tools = ["qemu-system-riscv64", "riscv64-unknown-elf-gcc"]
machine_opts = [
    "-machine virt",
    "-bios none",
    "-kernel kernel/kernel",
    "-m 128M",
    "-global virtio-mmio.force-legacy=false",
    "-drive file=fs.img,if=none,format=raw,id=x0",
    "-device virtio-blk-device,drive=x0,bus=virtio-mmio-bus.0",
]
interactive   = true
prompt        = "$ "
ready_markers = ["$ "]









protect = ["fs.img"]





[syscalls]
files   = ["kernel/syscall.h"]
pattern = '#define\s+SYS_(?P<name>\w+)\s+(?P<num>\d+)'
