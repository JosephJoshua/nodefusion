bwrite = { kind = "bcache.write", resource = "bcache", args = ["buf"] }
brelse = { kind = "bcache.release", resource = "bcache", args = ["buf"] }
begin_op = { kind = "log.begin", resource = "log" }
end_op = { kind = "log.end", resource = "log" }
