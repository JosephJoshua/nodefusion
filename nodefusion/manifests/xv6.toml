virtio_disk_rw = { kind = "disk.io", args = ["buf", "write"] }
virtio_disk_intr = "disk.interrupt"
ialloc = { kind = "inode.alloc", resource = "inode" }
iget = { kind = "inode.get", resource = "inode" }
iput = { kind = "inode.put", resource = "inode" }
ilock = { kind = "inode.lock", resource = "inode" }
iunlock = { kind = "inode.unlock", resource = "inode" }
iupdate = { kind = "inode.update", resource = "inode" }
bmap = { kind = "inode.bmap", resource = "inode" }
readi = { kind = "inode.read", resource = "inode" }
writei = { kind = "inode.write", resource = "inode" }
balloc = { kind = "disk.balloc", resource = "disk" }
bfree = { kind = "disk.bfree", resource = "disk" }
namei = { kind = "inode.namei", resource = "inode" }
dirlookup = { kind = "inode.dirlookup", resource = "inode" }
filealloc = "file.alloc"
fileclose = "file.close"
fileread = "file.read"
filewrite = "file.write"
filedup = "file.dup"
