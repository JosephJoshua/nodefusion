# StarryOS — Linux-compatible, process/thread split


















[kernel]
name   = "starry"
family = "arceos"


builds_on = "arceos"
arches = ["riscv64", "x86_64", "aarch64", "loongarch64"]
cache_hit_derivation = "semantic"
clone_completion_channel = "nftrace"
detect = { any_type = ["starry_kernel::task::process::topology::Process"] }

# ---------------------------------------------------------------- process

[[entity]]
name  = "process"
role  = "process"

# （syscall::fs::pidfd / syscall::signal / syscall::task::job /


type  = "starry_kernel::task::process::topology::Process"
label = "进程"



# SpinLock<BTreeMap<TgidNumber, Arc<Process>>>。





























[[entity.source]]
kind         = "tree"
completeness = "reachable_only"
reason       = "从 init 往下走。孤儿进程由 init 收养，所以正常情况下能走全；但这是内核的性质，不是这里保证的"
steps = [
  { static = "starry_kernel::task::process::topology::INIT_PROC" },
  { unwrap = ["LazyInit", "Arc"] },
  { walk   = { children = "children", via = ["SpinLock", "btreemap", "Arc"] }, key = "newtype<u32>" },
]

[entity.fields]
pid = { path = "pid", reader = "newtype<u32>", role = "id" }










exit_code    = { path = "tg.exit_code",    reader = "i32",  role = "exit_code" }
group_exited = { path = "tg.group_exited", reader = "bool" }









#   btree_opts(map) -> height 8 / node 0 / len 54 / keys 8 / vals 56




thread_tids  = { path = "tg.threads.map", reader = "btreemap<newtype<u32>, unit>" }











# starry-1f85a279.elf + starry-forkecho-ram512：
#   Process.identity            +0     Weak<PidIdentity>
#   PidIdentity.state           +24    IrqMutex<PidIdentityState>

#     SpinLock.__0              +0     BaseSpinLock<RawState, ..>
#     BaseSpinLock.data         +8     UnsafeCell<PidIdentityState>

#     ProcessLifecycle::Live.__0 +0    Weak<ProcessData>
#   ProcessData.aspace          +576   IrqMutex<Arc<Mutex<AddrSpace>>>
#   Mutex.data                  +16    UnsafeCell<AddrSpace>
#   AddrSpace.pt                +0     PageTable
#   PageTable.inner             +24    PageTableRef
#   PageTableRef.root           +0     Frame

































pgtbl = { path = "identity", reader = "weak<field<state, newtype<spinlock<field<process_lifecycle, variant<Live, field<__0, weak<field<aspace, newtype<spinlock<arc<mutex<field<pt, field<inner, field<root, field<paddr, usize>>>>>>>>>>>>>>>>>", role = "address_space_root" }

[entity.relations]
parent   = { path = "parent",   reader = "spinlock<weak>",   links_to = "process" }







#     `pub type StrongMap<K, V> = alloc::collections::btree_map::BTreeMap<K, V>;`





children = { path = "children", reader = "spinlock<btreemap<newtype<u32>, arc>>", links_to = "process" }


#   threads = { path = "tg", reader = "spinlock<struct>", links_to = "thread" }



#   Process size=152        tg +8  SpinLock<ThreadGroup>
#   ThreadGroup size=64     threads +0  BTreeSet<TidNumber>
#                           exit_code +56  group_exited +60







# ---------------------------------------------------------------- thread

# where `state` actually lives. Starry threads are ArceOS tasks underneath,
# so this entity reuses the arceos family's inner type.
[[entity]]
name  = "thread"
type  = "ax_task::task::TaskInner"
label = "线程"



source_combine = "union"









#   ax_task::api::TASK_REGISTRY @0xffffffff80524b80
#     LazyLock<SpinRwLock<BTreeMap<u64, Weak<RRTask<TaskInner,5>>>>,
#              fn() -> SpinRwLock<...>>





[[entity.source]]
kind         = "registry"
completeness = "partial"
reason       = "TASK_REGISTRY 装的是 Weak：任务退出后表项还在、但升不上来。所以这里枚举到的是**还活着的**那些，不是历史上全部"








#   LazyLock            size=48
#     value       +0    OnceLock<SpinRwLock<BTreeMap<…>>>   size=40
#        __0      +0      LazyInit<SpinRwLock<BTreeMap<…>>>
#     initializer +40   UnsafeCell<Option<fn() -> …>>


steps = [
  { static     = "ax_task::api::TASK_REGISTRY" },
  { field      = "value" },
  { field      = "__0" },
  { unwrap     = ["LazyInit", "SpinRwLock"] },



  #   BTreeMap<u64, Weak<RRTask<TaskInner,5>>>


  { iter       = "btreemap", key = "u64" },



  #   [4] iter btreemap -> MaybeDangling<alloc::sync::Weak<…RRTask<TaskInner,5>>>
  { unwrap     = ["MaybeDangling", "Weak"] },
  { descend_to = "ax_task::task::TaskInner" },
]







#   ax_task::run_queue::RUN_QUEUES @0xffffffff80d95538

#   AxRunQueue                          size=32 {cpu_id:0, scheduler:8}
#   BaseSpinLock<RawState,RRScheduler>  size=24 {_phantom:0, lock:0, data:8}
#   RRScheduler<TaskInner,5>            size=16 {ready_queue:0}
#   List<Arc<RRTask<TaskInner,5>>>      size=16 {list:0}
#   RawList<…>                          size=16 {head:0, len:8}
#   RRTask<TaskInner,5>                 size=960 {inner:0, time_slice:896,
#                                                 links:904}
#     Links{entry:0,inserted:16} -> UnsafeCell{value:0} -> ListEntry{next:0,prev:8}



















#   ...








[[entity.source]]
kind         = "registry"
completeness = "partial"
reason       = "各 CPU 就绪队列里排着的任务；正在跑的那个和已退出的不在这条链上"
steps = [
  { static     = "ax_task::run_queue::RUN_QUEUES" },
  { iter       = "array" },
  { unwrap     = ["MaybeUninit", "NonNull"] },
  { field      = "scheduler" },
  { unwrap     = ["BaseSpinLock"] },
  { field      = "ready_queue" },
  { iter = "list", link = "links", next = "next", terminator = "circular_headed" },
  { descend_to = "ax_task::task::TaskInner" },
]






#   _percpu_start、_percpu_end、_percpu_load_start、_percpu_load_end






#   ax_percpu::layout::INSTALLED_LAYOUT @0xffffffff80d95f08
#     PerCpuLayout size=48 {region:0, template_base:24, area_size:32,
#                           required_alignment:40}
#     PerCpuRegion size=24 {runtime_base:0, area_stride:8, area_count:16}
#     runtime_base  = 0xffffffe081002000   area_stride = 0x41000



#     template_base = 0xffffffff80d31140   area_size = 0x58a  align = 0x40











#   tid=1  is_idle=1  is_init=0  state=2











[[entity.source]]
kind         = "registry"
completeness = "partial"
reason       = "每个 CPU 的 idle 任务；就绪队列里没有它，队列空了才轮到它跑"
steps = [
  { percpu = "ax_task::run_queue::IDLE_TASK", layout = "ax_percpu::layout::INSTALLED_LAYOUT" },
  { unwrap     = ["MaybeUninit", "LazyInit", "Arc"] },
  { descend_to = "ax_task::task::TaskInner" },
]

[entity.fields]
id    = { path = "id",    reader = "newtype<u64>", role = "id" }
name  = { path = "name",  reader = "spinlock<string>", role = "name" }



state = { path = "state", reader = "atomic<enum>", enum = "ax_task::task::TaskState", role = "state" }


#   ax_task::task::TaskInner  sched_priority +816  core::sync::atomic::Atomic<i32>




priority = { path = "sched_priority", reader = "atomic<i32>", role = "priority" }




#   ctx +376  UnsafeCell<ax_cpu::riscv::context::TaskContext>






ctx   = { path = "ctx",   reader = "struct", role = "sched_context" }

# ------------------------------------------------------------- relations











#   AxTaskExt.__0       +0     extern_trait::Repr { __0: *mut (), __1: *mut () }

#   Thread.proc_data    +0     Arc<ProcessData>
#   ProcessData.proc    +1120  Arc<Process>





[entity.relations]
process = { path = "task_ext", links_to = "process", inverse = "threads", reader = "variant<Some, field<__0, field<__0, field<__0, ptr<astype<starry_kernel::task::Thread, field<proc_data, arc<field<proc, arc>>>>>>>>>" }








[entity.table]
empty = "这一帧没有枚举到活着的线程。注册表装的是 Weak，退出的任务升不上来。"
column = [
  { key = "slot",     label = "槽位", synthetic = true },
  { key = "id",       label = "TID" },
  { key = "name",     label = "名字" },
  { key = "state",    label = "状态" },
  { key = "priority", label = "优先级" },
]

# ---------------------------------------------------------------- watches



# starry-kernel / starry-signal / starry-vm / starry-fatfs / starryos。






[[watch]]
subsystem = "panic"
match     = { fn = ["rust_begin_unwind", "__rust_alloc_error_handler",
                    "handle_alloc_error"] }
snapshot  = "always"
args      = 2
throttle  = 0

[[watch]]
subsystem = "task"
match     = { module = "starry_kernel::task" }
args      = 2
throttle  = 0

[[watch]]
subsystem = "syscall"
match     = { module = "starry_kernel::syscall" }
args      = 3          # syscalls want more args than anything else
throttle  = 0

[[watch]]
subsystem = "trap"
match     = { module = "starry_kernel::trap" }
args      = 2
throttle  = 0

# Keep addressable entry points exact; the bounded HTML has its own sampler.
[[watch]]
subsystem = "mm"
match     = { module = "starry_kernel::mm::loader", fn = ["load_user_app"] }
args      = 2
throttle  = 0

[[watch]]
subsystem = "vm"
match     = { module = "starry_kernel::mm::aspace", fn = ["map_with_reported_flags", "map_linear", "extend_area", "unmap", "unmap_metadata"] }
args      = 3
throttle  = 0

[[watch]]
subsystem = "mm"
match     = { module = "starry_kernel::mm" }
args      = 2
throttle  = 0

[[watch]]
subsystem = "fs"
match     = { module = ["starry_kernel::file", "starry_kernel::pseudofs"] }
args      = 2
throttle  = 0

[[watch]]
subsystem = "ipc"
match     = { module = "starry_kernel::ipc" }
args      = 2
throttle  = 0






[[watch]]
subsystem = "ax-task"
match     = { module = "ax_task" }
args      = 2
throttle  = 0



#   ax_cpu::riscv::context::context_switch_raw







[[watch]]
subsystem = "sched"
match     = { module = "ax_cpu", fn = ["context_switch*"] }
args      = 2
throttle  = 0

[[watch]]
subsystem = "ax-mm"
match     = { module = "ax_mm::backend", fn = ["map", "unmap"] }
args      = 2
throttle  = 0

[[watch]]
subsystem = "ax-mm"
match     = { module = "ax_mm" }
args      = 2
throttle  = 0

[[watch]]
subsystem = "ax-alloc"
match     = { module = "ax_alloc", fn = ["dealloc_pages"] }
args      = 3
throttle  = 0

[[watch]]
subsystem = "ax-alloc"
match     = { module = "ax_alloc" }
args      = 1
throttle  = 0















#     cache::device::{impl#3}::read_block  →  runtime::lifecycle::io::read_blocks






[[watch]]
subsystem = "disk"
match     = { module = "ax_fs_ng::block::runtime::lifecycle::io", fn = ["read_blocks", "write_blocks_with_flags"] }
args      = 2
throttle  = 0

[[watch]]
subsystem = "disk"
match     = { module = "ax_fs_ng::block::runtime::lifecycle::io" }
args      = 2
throttle  = 0

[[watch]]
subsystem = "fs"
match     = { module = "ax_fs_ng::block::cache::device", fn = ["read_block", "write_block"] }
args      = 2
throttle  = 0

[[watch]]
subsystem = "fs"
match     = { module = "ax_fs_ng::block::cache::device" }
args      = 2
throttle  = 0








#   _RNvMs0_...7journalINtB5_7Jbd2Dev...E6commitB17_









#     `CloneTransaction::commit`、`CowCloneTransaction::commit`、









[[watch]]
subsystem = "fs"
match     = { module = "rsext4::blockdev::journal", fn = ["commit", "commit_for_filesystem_sync"] }
inlined   = true
args      = 2
throttle  = 0








[[watch]]
subsystem = "mm"
match     = { module = "page_table_generic::table", fn = ["map_page"] }
inlined   = true
args      = 4
throttle  = 0



