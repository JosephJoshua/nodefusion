# ---------------------------------------------------------------- profile





[profile]





kernel_elf   = "target/riscv64gc-unknown-none-elf/release/starryos"




kernel_image = "target/riscv64gc-unknown-none-elf/release/starryos.bin"









build = """
CARGO_PROFILE_RELEASE_DEBUG=2 {mv} cargo xtask starry build --config os/StarryOS/configs/board/qemu-riscv64.toml 2>&1 | tail -20\
"""









detect_files = [
  "xtask/src/main.rs",
  "os/StarryOS/starryos/Cargo.toml",
  "scripts/axbuild/src/starry/mod.rs",
]


required_tools = ["qemu-system-riscv64", "cargo", "rust-objcopy"]












#     cargo xtask starry rootfs --arch riscv64


machine_opts = [
    "-machine virt",
    "-bios default",
    "-kernel target/riscv64gc-unknown-none-elf/release/starryos.bin",
    "-m 512M",
    "-cpu rv64",
    "-device nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive id=disk0,if=none,format=raw,snapshot=on,file=tmp/axbuild/rootfs/rootfs-riscv64-alpine.img",
    "-device virtio-net-pci,netdev=net0",
    "-netdev user,id=net0",
]


protect = ["tmp/axbuild/rootfs/rootfs-riscv64-alpine.img"]





interactive = true
prompt      = "root@starry:"








ready_markers = [
  "platform = riscv-virtio,qemu",
  "kmod subsystem initialized",
  "HOSTNAME=starry",
]


#   [starry_kernel::entry:162] shutdown: unmount_all failed (best-effort)













done_markers = []

build_deviation = "本次观测的内核用 CARGO_PROFILE_RELEASE_DEBUG=2 编，仓库默认的 release（[profile.release] 只设了 lto = false）不带任何调试信息，没有 DWARF 就解不出结构、也挂不上观察点。只加调试段，不改优化等级、不改 feature、不动仓库里任何文件。"























