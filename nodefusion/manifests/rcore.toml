subsystem = "task"
match     = { fn = ["current_user_token", "current_trap_cx"] }
skip      = true




[[watch]]
subsystem = "sched"
match     = { fn = ["__switch"] }
args      = 2
throttle  = 0




[[watch]]
subsystem = "panic"
match     = { fn = ["rust_begin_unwind", "__rust_alloc_error_handler"] }
snapshot  = "always"
args      = 2
throttle  = 0



