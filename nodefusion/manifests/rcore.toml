# rCore-Tutorial — ONE manifest for all chapters
# This is the file the whole redesign exists for. Today NodeFusion carries
# five hand-written resolvers dispatched on an integer RCORE_TASKS_KIND, and
# guest.py branches on it in ~95 places.
# The key realisation: layout.py ALREADY detects the shape by probing DWARF
# (layout.py:734/813/864/994/1000). Detection was never the hard part. The
# branching downstream was. So the manifest declares all five shapes as
# ORDERED ALTERNATIVES with `when` predicates, and the engine takes the first
# that resolves. No chapter flag anywhere.
# shapes, from NodeFusion's own verified knowledge:








#   <os::task::INITPROC as core::ops::deref::Deref>::deref::__stability::LAZY



[kernel]
name   = "rcore"
family = "rcore"
arches = ["riscv64"]
cache_hit_derivation = "one_to_one"














detect = { any_type = ["os::task::task::TaskControlBlock",
                       "os::batch::AppManager",
                       "os::console::Stdout"] }

# ch8 is the first chapter where a process and a schedulable task are distinct
# objects.  Keep the split in the manifest: the active entity is selected by
# which source compiles for the current ELF, not by a chapter number.
[[entity]]
name  = "process"
role  = "process"
type  = "os::task::process::ProcessControlBlock"
label = "进程"

[[entity.source]]
kind         = "tree"
completeness = "reachable_only"
when         = { type_exists = "os::task::process::ProcessControlBlock" }
steps = [
  { static = "os::task::INITPROC" },
  { unwrap = ["Lazy", "Arc"] },
  { walk   = { children = "inner.children", via = ["UPSafeCell", "Vec", "Arc"] } },
]

[entity.fields]
pid     = { path = "pid",                                  reader = "newtype<usize>", role = "id" }
pgtbl   = { path = "inner.memory_set.page_table.root_ppn.__0", reader = "ppn", role = "address_space_root" }
exit    = { path = "inner.exit_code",                      reader = "i32", role = "exit_code" }
zombie  = { path = "inner.is_zombie",                      reader = "bool" }
signals = { path = "inner.signals",                        reader = "field<bits, u32>" }

[entity.relations]
parent   = { path = "inner.parent",   reader = "option<weak>",     links_to = "process" }
children = { path = "inner.children", reader = "vec<arc>",         links_to = "process" }
threads  = { path = "inner.tasks",    reader = "vec<option<arc>>", links_to = "thread" }

[[entity]]
name  = "thread"
role  = "thread"
type  = "os::task::task::TaskControlBlock"
label = "线程"

[[entity.source]]
kind         = "tree"
completeness = "reachable_only"
when         = { type_exists = "os::task::process::ProcessControlBlock" }
steps = [
  { static = "os::task::INITPROC" },
  { unwrap = ["Lazy", "Arc"] },
  { walk   = { children = "inner.children", via = ["UPSafeCell", "Vec", "Arc"] } },
  { field  = "inner.tasks" },
  { iter   = "vec", via = ["UPSafeCell", "Vec", "Option", "Arc"] },
]

[entity.fields]
status  = { path = "inner.task_status",      reader = "enum", enum = "TaskStatus", role = "state" }
task_cx = { path = "inner.task_cx",          reader = "struct", role = "sched_context" }
trapcx  = { path = "inner.trap_cx_ppn.__0",  reader = "ppn", role = "trap_context" }
exit    = { path = "inner.exit_code",        reader = "variant<Some, field<__0, i32>>", role = "exit_code" }

[entity.relations]
process = { path = "process", reader = "weak", links_to = "process" }

[entity.table]
empty = "当前没有可枚举的线程。"

  [[entity.table.column]]
  key = "slot"
  label = "槽位"
  synthetic = true

  [[entity.table.column]]
  key = "status"
  label = "状态"

  [[entity.table.column]]
  key = "exit"
  label = "退出码"

  [[entity.table.column]]
  key = "trapcx"
  label = "陷入上下文"
  format = "hex"

[[entity]]
name  = "task"
role  = "process"
type  = "os::task::task::TaskControlBlock"
label = "任务"

# ---- shape 2: process tree (ch5-ch7)
[[entity.source]]
kind         = "tree"
completeness = "reachable_only"
when         = { field_exists = { type = "TaskControlBlockInner", field = "children" } }
steps = [
  { static = "os::task::INITPROC" },
  { unwrap = ["Lazy", "Arc"] },
  { walk   = { children = "inner.children", via = ["UPSafeCell", "Vec", "Arc"] } },
]

# ---- shape 1: heap Vec
# discriminator is the DWARF type of `tasks`, exactly as layout.py:977 tests.
# RawVec puts cap BEFORE ptr; that order is the compiler's, so the probe asks
# DWARF field by field rather than assuming.
[[entity.source]]
kind         = "table"
completeness = "total"
when         = { field_type = { type = "TaskManagerInner", field = "tasks", starts_with = "Vec<" } }
steps = [
  { static = "os::task::TASK_MANAGER" },
  { unwrap = ["Lazy"] },
  { field  = "inner.tasks" },
  { iter   = "vec" },
]

# ---- shape 0: inline fixed array (ch3-ch4)
# element count comes from DWARF's DW_AT_count, never from
# byte_size / elem_size -- trailing padding makes that division wrong.
[[entity.source]]
kind         = "table"
completeness = "total"
when         = { field_exists = { type = "TaskManagerInner", field = "tasks" } }
steps = [
  { static = "os::task::TASK_MANAGER" },
  { unwrap = ["Lazy"] },
  { field  = "inner.tasks" },
  { iter   = "array" },
]

# ---- shape 3: batch (ch2). no tasks at all.
[[entity.source]]
kind         = "batch"
completeness = "none"
when         = { type_exists = "os::batch::AppManager" }
reason       = "ch2 是批处理，没有任务表；只有当前应用序号"
steps = [


  { static = "os::batch::APP_MANAGER" },
  { unwrap = ["Lazy", "UPSafeCell"] },
]

# ch1 has neither TaskControlBlock nor AppManager.  This source records that
# structural absence explicitly; it intentionally enumerates no entities.
[[entity.source]]
kind         = "batch"
completeness = "none"
when         = { type_exists = "os::console::Stdout" }
reason       = "ch1 没有任务或批处理管理器"
steps = []

[entity.fields]
# every path below is optional across chapters: ch2 has no pid, ch3 has no
# parent. absent here means absent-by-construction for that chapter, which
# is exactly the tri-state the UI needs.
status = { path = "task_status", reader = "enum", enum = "TaskStatus", role = "state" }








task_cx = { path = "task_cx", reader = "struct", role = "sched_context" }

[entity.optional_fields]
pid   = { path = "pid",             reader = "newtype<usize>", role = "id" }
base  = { path = "base_size",       reader = "usize" }
# the root is a *page number*, not an address: PageTable.root_ppn is a
# PhysPageNum(usize). pointing this at `memory_set` yielded that struct's own
# address, which the page-table walk then reported as "not in observed
# physical memory" -- a unit error that reads like missing memory.
# `.__0` rather than the tuple struct itself so no field offset is assumed.
pgtbl = { path = "inner.memory_set.page_table.root_ppn.__0", reader = "ppn", role = "address_space_root" }
prio  = { path = "inner.priority",  reader = "usize", role = "priority" }




exit  = { path = "inner.exit_code", reader = "i32", role = "exit_code" }



trapcx = { path = "inner.trap_cx_ppn.__0", reader = "ppn", role = "trap_context" }
# These relations appear only once rCore introduces a process tree (ch5).
# They are optional fields with links, so ch3/ch4 report structural absence
# rather than claiming that a required relation failed to decode.
parent   = { path = "inner.parent",   reader = "option<weak>", links_to = "task" }
children = { path = "inner.children", reader = "vec<arc>",     links_to = "task" }






#   BLOCK_CACHE_MANAGER : Lazy<Mutex<BlockCacheManager>>


#     BlockCacheManager.queue : VecDeque<(usize, Arc<Mutex<BlockCache>>)>

#       Arc  -> ArcInner.data -> Mutex<BlockCache> -> TicketMutex.value



[[entity]]
name  = "blockcache"
type  = "easy_fs::block_cache::BlockCache"
label = "块缓存 (easy-fs)"

[[entity.source]]
kind         = "table"
completeness = "total"
when         = { type_exists = "easy_fs::block_cache::BlockCacheManager" }
steps = [
  { static  = "easy_fs::block_cache::BLOCK_CACHE_MANAGER" },
  { unwrap  = ["Lazy", "Mutex"] },
  { field   = "queue" },
  { iter    = "vecdeque" },
  { field   = "__1" },
  { unwrap  = ["Arc", "Mutex"] },
]

[entity.fields]
block_id = { path = "block_id", reader = "usize" }
modified = { path = "modified", reader = "bool" }

[entity.table]
empty = "块缓存是空的 —— 还没有任何块被读进来。"

  [[entity.table.column]]
  key = "slot"
  label = "槽位"
  synthetic = true

  [[entity.table.column]]
  key = "block_id"
  label = "块号"

  [[entity.table.column]]
  key = "modified"
  label = "已修改"
  format = "bool"

# ---------------------------------------------------------------- watches










