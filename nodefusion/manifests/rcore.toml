[absent]
"log.commit" = { why = "feature", evidence = "easy-fs/src 整个 crate grep 不到 log / journal / transaction。最像的 block_cache_sync_all()（Inode::write_at 末尾调一次）只把缓存里的脏块逐个写回，没有日志块、没有原子性、没有崩溃恢复；xv6 的 commit 图的正是崩溃原子性。" }
"bcache.read" = { why = "feature", when = { type_missing = "easy_fs::block_cache::BlockCacheManager" }, evidence = "rCore ch1–ch5 源码尚无 easy-fs；ch6 起引入 easy-fs/src/block_cache.rs。按当前 ELF 的 DWARF 核对 BlockCacheManager 类型，只有缺席的构建适用。" }
"disk.io" = { why = "feature", when = { type_missing = "easy_fs::block_cache::BlockCacheManager" }, evidence = "rCore ch1–ch5 尚无 easy-fs 和块设备驱动；ch6 起的 os/src/drivers/block/virtio_blk.rs 实现块 I/O。按当前 ELF 的 BlockCacheManager 类型区分阶段。" }
"sched.switch" = { why = "feature", when = { type_missing = "os::task::task::TaskControlBlock" }, evidence = "ch1 仅运行内核，ch2 的 loader.c 按序装入应用；两者均无任务控制块和任务上下文切换。ch3 起定义 TaskControlBlock 与 __switch。" }
"proc.initproc" = { why = "feature", when = { type_missing = "os::task::task::TaskControlBlock" }, evidence = "ch1 不运行用户应用，ch2 在 loader.c 中逐个装入应用，尚无内核进程对象或初始进程表。ch3 起定义 TaskControlBlock。" }
"proc.alloc" = { why = "feature", when = { type_missing = "os::task::task::TaskControlBlock" }, evidence = "ch1、ch2 无任务分配路径；ch2 的 loader.c 复用同一应用内存区依次装入二进制，ch3 起引入 TaskControlBlock。" }
"proc.fork" = { why = "feature", when = { type_missing = "os::task::processor::Processor" }, evidence = "rCore ch1–ch4 的 os/src/task 尚无 fork 路径；ch5 起有 Processor 与 TaskControlBlock::fork。按当前 ELF 的 Processor 类型核对阶段。" }
"proc.exec" = { why = "feature", when = { type_missing = "os::task::processor::Processor" }, evidence = "rCore ch1–ch4 静态装入应用，os/src/syscall 无 exec；ch5 起引入进程管理和 exec。按当前 ELF 的 Processor 类型核对阶段。" }
"vm.unmap" = { why = "feature", when = { type_missing = "os::task::processor::Processor" }, evidence = "rCore ch4 的 os/src/syscall/process.rs 中 sys_munmap 明确为 NOT IMPLEMENTED YET；ch5 起有进程内存回收。按当前 ELF 的 Processor 类型区分阶段。" }
"phys.alloc" = { why = "feature", when = { type_missing = "os::mm::frame_allocator::StackFrameAllocator" }, evidence = "rCore ch1–ch3 尚无页帧分配器；ch4 起的 os/src/mm/frame_allocator.rs 定义 StackFrameAllocator。按当前 ELF 的该类型核对阶段。" }
"phys.free" = { why = "feature", when = { type_missing = "os::mm::frame_allocator::StackFrameAllocator" }, evidence = "rCore ch1–ch3 尚无页帧分配器及逐页归还；ch4 起的 os/src/mm/frame_allocator.rs 实现分配与回收。按当前 ELF 的类型核对阶段。" }
"vm.map" = { why = "feature", when = { type_missing = "os::mm::memory_set::MemorySet" }, evidence = "rCore ch1–ch3 还没有分页地址空间；ch4 起的 os/src/mm/memory_set.rs 定义 MemorySet 并建立区域映射。按当前 ELF 的类型核对阶段。" }
"pagetable.map" = { why = "feature", when = { type_missing = "os::mm::memory_set::MemorySet" }, evidence = "rCore ch1–ch3 不使用页表映射；ch4 起的 os/src/mm/page_table.rs 与 MemorySet 配合建表。按当前 ELF 的 MemorySet 类型核对阶段。" }
























