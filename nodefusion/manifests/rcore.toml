[profile]

kernel_elf   = "os/target/riscv64gc-unknown-none-elf/release/os"
kernel_image = "os/target/riscv64gc-unknown-none-elf/release/os.bin"










# application/x-git-upload-pack-result but found application/octet-stream"），











build = "cd os && CARGO_NET_GIT_FETCH_WITH_CLI=true CARGO_PROFILE_RELEASE_DEBUG=2 CARGO_PROFILE_RELEASE_STRIP=none make {mv} build 2>&1 | tail -20"


detect_files   = ["os/src/main.rs", "os/src/sbi.rs", "os/src/linker.ld"]
required_tools = ["qemu-system-riscv64", "cargo"]








machine_opts = [
    "-machine virt",
    "-bios default",
    "-kernel os/target/riscv64gc-unknown-none-elf/release/os.bin",
    "-m 128M",
]

interactive   = false
ready_markers = ["[kernel]"]

done_markers  = ["All applications completed!"]












panic_markers = ["[kernel] Panicked at"]



halt_markers  = ["Panicked at"]
unsupported   = ["program", "stdin_after"]











stdin_preload = true


stdin_pad = "\n"

build_deviation = "本次观测的内核是带调试信息编的（CARGO_PROFILE_RELEASE_DEBUG=2、CARGO_PROFILE_RELEASE_STRIP=none），不是 `make run` 默认产出的那个二进制。实测差异：.text 从 0xbf58 涨到 0xc11e（+454 字节 / +0.93%），因为调试信息会抑制内联 —— sys_mmap、sys_munmap、sys_get_time、sys_sbrk、run_next_task、UPSafeCell::exclusive_access 在默认构建里被内联掉、连符号都没有，加了调试信息才独立存在（观测点也正是靠这个才挂得上）。因此本次的指令计数与默认构建会有细微出入；程序语义不变（同一份源码、同一优化级别），数据结构布局也不变（实测两种构建下同名数据符号大小逐一相同）。"


# `const LINE_START: &str = ">> "`。
shell_prompt       = ">> "
shell_ready_marker = ">> "


# `println!("Shell: Process {} exited with code {}", pid, exit_code)`。










exit_marker = 'Shell: Process \d+ exited with code (-?\d+)'





[profile.shell_probe]
dir   = "os/src"
ident = "INITPROC"






[[profile.device]]
file = "user/target/riscv64gc-unknown-none-elf/release/fs.img"






built_when = { file = "os/Makefile", contains = "fs-img" }
opts = [
    "-drive file=user/target/riscv64gc-unknown-none-elf/release/fs.img,if=none,format=raw,id=x0",
    "-device virtio-blk-device,drive=x0,bus=virtio-mmio-bus.0",
]





[syscalls]
files   = ["os/src/syscall/mod.rs"]
pattern = 'const\s+SYSCALL_(?P<name>\w+)\s*:\s*usize\s*=\s*(?P<num>\d+)'
