<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="title desc">
  <title id="title">阻塞锁交接与条件变量唤醒</title>
  <desc id="desc">阻塞锁解锁时将持有权交给等待队首，locked 保持 1。条件变量 signal 将等待线程变为就绪；线程恢复后重新获得互斥锁，再从 wait 返回并检查条件。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linejoin="round"/></marker></defs>
  <rect width="880" height="480" fill="#fafbf8"/>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#243d35">
    <text x="28" y="38" font-size="24" font-weight="600" fill="#243d35" text-anchor="start">锁的交接与条件变量通知</text>
    <text x="28" y="87" font-size="22" font-weight="600" fill="#243d35" text-anchor="start">阻塞互斥锁</text>
    <text x="458" y="87" font-size="22" font-weight="600" fill="#243d35" text-anchor="start">条件变量</text>
    <path d="M440 70 V446" fill="none" stroke="#8a9d92" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="28" y="108" width="394" height="100" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="44" y="140" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">① A 持锁</text>
    <text x="44" y="169" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">locked = 1</text>
    <text x="44" y="196" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">等待队列：B → C</text>
    <path d="M225 208 V217" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="28" y="228" width="394" height="100" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="44" y="260" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">② A 解锁，唤醒 B</text>
    <text x="44" y="289" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">锁直接交给队首 B</text>
    <text x="44" y="316" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">locked 保持 1</text>
    <path d="M225 328 V337" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="28" y="348" width="394" height="100" rx="5" fill="#e4f0e6" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="44" y="380" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">③ B 恢复 lock 调用</text>
    <text x="44" y="409" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">B 进入临界区</text>
    <text x="44" y="436" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">C 继续等待</text>
    <rect x="458" y="108" width="394" height="100" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="474" y="140" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">① A 调用 wait</text>
    <text x="474" y="169" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">释放互斥锁</text>
    <text x="474" y="196" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">进入条件变量等待队列</text>
    <path d="M655 208 V217" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="458" y="228" width="394" height="100" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="474" y="260" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">② B 修改条件，signal</text>
    <text x="474" y="289" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">A 变为就绪</text>
    <text x="474" y="316" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">B 此时仍可能持锁</text>
    <path d="M655 328 V337" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="458" y="348" width="394" height="100" rx="5" fill="#e4f0e6" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="474" y="380" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">③ A 恢复 wait 调用</text>
    <text x="474" y="409" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">重新取得互斥锁</text>
    <text x="474" y="436" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">返回并再次检查条件</text>
  </g>
</svg>
