<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>逐步查看任务切换</title>
  <link rel="icon" href="ch3-context.svg" type="image/svg+xml">
  <link rel="stylesheet" href="switch.css">
</head>
<body>
  <main>
    <header>
      <a id="return-to-lesson" href="../ch3/index.html">返回第三章正文</a>
      <h1>任务切换</h1>
    </header>
    <div id="controls" hidden>
      <div class="toolbar" aria-label="切换过程操作">
        <div class="choices">
          <label>内核 <select id="kernel"><option value="rcore">rCore</option><option value="ucore">uCore</option></select></label>
          <label>场景 <select id="scenario"><option value="yield">主动让出</option><option value="timer">时钟抢占</option><option value="exit">A 退出</option><option value="alone">仅 A 可运行</option></select></label>
        </div>
      </div>
      <div class="workspace">
        <section aria-label="切换过程">
          <div class="mechanism" aria-label="任务与调度器">
            <div class="node" id="node-a">
              <svg viewBox="0 0 220 108" preserveAspectRatio="none" aria-hidden="true"><path d="M8 4 H212 Q216 4 216 8 V100 Q216 104 212 104 H8 Q4 104 4 100 V8 Q4 4 8 4 Z"/></svg>
              <strong>A</strong><span id="svg-a">运行</span>
            </div>
            <span id="edge-first" class="edge" aria-hidden="true">→</span>
            <div class="node" id="node-scheduler">
              <svg viewBox="0 0 220 108" preserveAspectRatio="none" aria-hidden="true"><path d="M8 4 H212 Q216 4 216 8 V100 Q216 104 212 104 H8 Q4 104 4 100 V8 Q4 4 8 4 Z"/></svg>
              <strong id="middle-label">选择任务</strong><span id="svg-middle">A 的内核态</span>
            </div>
            <span id="edge-second" class="edge" aria-hidden="true">→</span>
            <div class="node" id="node-b">
              <svg viewBox="0 0 220 108" preserveAspectRatio="none" aria-hidden="true"><path d="M8 4 H212 Q216 4 216 8 V100 Q216 104 212 104 H8 Q4 104 4 100 V8 Q4 4 8 4 Z"/></svg>
              <strong id="target-label">B</strong><span id="svg-b">就绪</span>
            </div>
          </div>
          <div class="navigation" aria-label="切换步骤">
            <button id="previous" type="button">上一步</button>
            <span id="progress" aria-label="步骤进度"></span>
            <button id="next" type="button">下一步</button>
            <button id="reset" type="button">重置</button>
          </div>
          <div class="step-copy" aria-live="polite"><h2 id="step-title">A 正在执行</h2><p id="explanation"></p></div>
        </section>
        <table>
          <caption>执行状态</caption>
          <tbody>
            <tr><th scope="row">实际执行位置</th><td id="execution"></td></tr>
            <tr><th scope="row">当前任务</th><td id="current"></td></tr>
            <tr><th scope="row">本过程切换次数</th><td id="switch-count"></td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <details open>
      <summary>静态图</summary>
      <img src="ch3-switch.svg" alt="rCore 直接切换，uCore 经过调度器进行两次切换" width="900" height="470">
    </details>
    <p class="source">本图依照第三章参考实现编写。<a href="../ch3/rcore.html">rCore 源码分析</a> · <a href="../ch3/ucore.html">uCore 源码分析</a></p>
  </main>
  <script src="switch.js"></script>
</body>
</html>
