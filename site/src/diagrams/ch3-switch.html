<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>逐步查看任务切换</title>
  <link rel="icon" href="ch3-context.svg" type="image/svg+xml">
  <link rel="stylesheet" href="switch.css">
  <link rel="stylesheet" href="explorer.css">
</head>
<body>
  <main>
    <header>
      <a id="return-to-lesson" href="../ch3/index.html">返回第三章正文</a>
      <h1>任务切换</h1>
    </header>
    <div id="controls" hidden>
      <div class="toolbar" aria-label="切换过程操作">
        <div class="choices">
          <label>内核 <select id="kernel"><option value="rcore">rCore</option><option value="ucore">uCore</option></select></label>
          <label>场景 <select id="scenario"><option value="yield">主动让出</option><option value="timer">时钟抢占</option><option value="exit">A 退出</option><option value="alone">仅 A 可运行</option></select></label>
        </div>
      </div>
      <div class="workbench">
        <section class="stage" aria-label="切换过程">
          <figure class="execution-figure"><figcaption>处理器的执行位置 <span>横轴为执行顺序</span></figcaption><svg id="execution-path" class="mechanism-svg" viewBox="0 0 680 300" role="group" aria-label="执行位置随步骤变化"></svg></figure>
          <div class="plot-legend"><span>进入 / 返回用户态</span><span>切换内核上下文</span></div>
          <div class="transport"><div class="navigation" aria-label="切换步骤">
            <button id="previous" type="button">上一步</button>
            <button id="next" type="button">下一步</button>
            <button id="reset" type="button">重置</button>
          </div><div id="step-timeline"></div></div>
        </section>
        <aside class="inspector" aria-label="当前执行状态">
          <div class="step-copy" aria-live="polite"><h2 id="step-title">A 正在执行</h2><p id="explanation"></p></div>
          <dl class="state-table"><dt>执行位置</dt><dd id="execution"></dd><dt>当前任务</dt><dd id="current"></dd><dt>A 状态</dt><dd id="a-state"></dd><dt>B 状态</dt><dd id="b-state"></dd><dt>切换次数</dt><dd id="switch-count"></dd></dl>
          <ul id="state-changes" class="change-list" aria-label="本步状态变化"></ul>
          <details class="secondary"><summary>寄存器保存与恢复</summary><div id="context-transfer" class="context-transfer" aria-label="寄存器保存与恢复"></div></details>
        </aside>
      </div>
      <details class="secondary"><summary>比较 rCore 与 uCore 的切换路径</summary><svg id="switch-comparison" class="mechanism-svg comparison" viewBox="0 0 360 150" role="img" aria-label="rCore 和 uCore 的上下文切换路径"></svg><p id="switch-insight"></p><dl class="state-table"><dt>rCore 调用 __switch</dt><dd id="rcore-count"></dd><dt>uCore 调用 swtch</dt><dd id="ucore-count"></dd></dl></details>
    </div>
    <details id="static-diagram" open>
      <summary>静态图</summary>
      <img src="ch3-switch.svg" alt="rCore 直接切换，uCore 经过调度器进行两次切换" width="900" height="470">
    </details>
    <p class="source">本图依照第三章参考实现编写。<a href="../ch3/rcore.html">rCore 源码分析</a> · <a href="../ch3/ucore.html">uCore 源码分析</a></p>
  </main>
  <script src="explorer.js"></script><script src="switch.js"></script>
</body>
</html>
