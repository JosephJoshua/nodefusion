<svg xmlns="http://www.w3.org/2000/svg" width="880" height="396" viewBox="0 0 880 396" role="img" aria-labelledby="title desc">
  <title id="title">rCore 与 uCore 的任务切换</title>
  <desc id="desc">rCore 从任务 A 直接切换到任务 B。uCore 先从 A 切换到调度器，再从调度器切换到 B。切换恢复的是内核上下文，之后各自经异常返回进入用户态。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linejoin="round"/></marker></defs>
  <rect width="880" height="396" fill="#fafbf8"/>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#243d35">
    <text x="28" y="38" font-size="24" font-weight="600" fill="#243d35" text-anchor="start">从 A 让出到 B 运行</text>
    <text x="28" y="85" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">rCore：直接切换</text>
    <rect x="28" y="103" width="286" height="85" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="44" y="135" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">任务 A</text>
    <text x="44" y="164" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">标记 Ready，选择 B</text>
    <rect x="566" y="103" width="286" height="85" rx="5" fill="#e4f0e6" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="582" y="135" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">任务 B</text>
    <text x="582" y="164" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">恢复内核上下文，继续执行</text>
    <path d="M314 147 H554" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="440" y="130" font-size="18" font-weight="600" fill="#243d35" text-anchor="middle">__switch(A, B)</text>
    <text x="440" y="175" font-size="18" font-weight="400" fill="#52675e" text-anchor="middle">保存 A，恢复 B</text>
    <text x="28" y="236" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">uCore：经过调度器</text>
    <rect x="28" y="254" width="212" height="85" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="44" y="286" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">进程 A</text>
    <text x="44" y="315" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">yield → sched</text>
    <rect x="334" y="254" width="212" height="85" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="350" y="286" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">调度器</text>
    <text x="350" y="315" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">扫描进程表，选择 B</text>
    <rect x="640" y="254" width="212" height="85" rx="5" fill="#e4f0e6" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="656" y="286" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">进程 B</text>
    <text x="656" y="315" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">恢复内核上下文</text>
    <path d="M240 296 H322" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="281" y="282" font-size="17" font-weight="400" fill="#243d35" text-anchor="middle">swtch</text>
    <path d="M546 296 H628" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="587" y="282" font-size="17" font-weight="400" fill="#243d35" text-anchor="middle">swtch</text>
    <text x="28" y="375" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">B 继续内核调用，随后恢复用户寄存器并执行 sret。</text>
  </g>
</svg>
