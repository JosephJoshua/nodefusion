<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" viewBox="0 0 880 510" role="img" aria-labelledby="title desc">
  <title id="title">批处理装载与系统调用</title>
  <desc id="desc">用户程序执行 ecall 或发生异常后进入内核。普通系统调用更新返回值并恢复原应用；退出和应用异常转到装载器，覆盖程序区域并建立下一应用的初始上下文。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linejoin="round"/></marker></defs>
  <rect width="880" height="510" fill="#fafbf8"/>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#243d35">
    <text x="28" y="38" font-size="24" font-weight="600" fill="#243d35" text-anchor="start">系统调用与批次推进</text>
    <rect x="28" y="65" width="824" height="145" rx="5" fill="#e4f0e6" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="44" y="94" font-size="18" font-weight="600" fill="#243d35" text-anchor="start">用户态</text>
    <rect x="28" y="235" width="824" height="245" rx="5" fill="#edf0ec" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="44" y="264" font-size="18" font-weight="600" fill="#243d35" text-anchor="start">监督者模式</text>
    <rect x="128" y="112" width="252" height="85" rx="5" fill="#e4f0e6" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="144" y="144" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">当前应用</text>
    <text x="144" y="173" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">入口 0x80400000</text>
    <rect x="528" y="112" width="296" height="85" rx="5" fill="#e4f0e6" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="544" y="144" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">继续执行原应用</text>
    <text x="544" y="173" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">ecall 后的指令，a0 为结果</text>
    <rect x="128" y="287" width="252" height="85" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="144" y="319" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">异常入口</text>
    <text x="144" y="348" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">保存寄存器，切换内核栈</text>
    <rect x="528" y="287" width="296" height="85" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="544" y="319" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">处理普通系统调用</text>
    <text x="544" y="348" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">sepc += 4，写入返回值 a0</text>
    <rect x="128" y="404" width="696" height="67" rx="5" fill="#f5eddc" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="144" y="436" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">装载下一应用</text>
    <text x="144" y="465" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">覆盖程序区域，重新设置用户入口、栈与寄存器</text>
    <path d="M254 197 V276" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="270" y="225" font-size="17" font-weight="400" fill="#52675e" text-anchor="start">ecall / 应用异常</text>
    <path d="M380 329 H516" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="405" y="315" font-size="17" font-weight="400" fill="#52675e" text-anchor="start">普通调用</text>
    <path d="M676 287 V209" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="692" y="231" font-size="17" font-weight="400" fill="#52675e" text-anchor="start">恢复寄存器</text>
    <text x="692" y="255" font-size="17" font-weight="400" fill="#52675e" text-anchor="start">sret</text>
    <path d="M254 372 V392" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="393" y="395" font-size="17" font-weight="400" fill="#52675e" text-anchor="start">exit / 应用异常</text>
    <path d="M113 437 H92 V153 H116" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="30" y="503" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">批次结束时，装载器终止内核运行。</text>
  </g>
</svg>
