<svg xmlns="http://www.w3.org/2000/svg" width="880" height="574" viewBox="0 0 880 574" role="img" aria-labelledby="title desc">
  <title id="title">打开文件与 fork 后的引用</title>
  <desc id="desc">父进程两次打开同一文件，得到文件对象 A 和 B，各自保存偏移。fork 复制描述符引用，子进程共享原来的 A 和 B。A、B 都引用同一 inode。虚线箭头表示引用关系。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linejoin="round"/></marker></defs>
  <rect width="880" height="574" fill="#fafbf8"/>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#243d35">
    <text x="28" y="38" font-size="24" font-weight="600" fill="#243d35" text-anchor="start">两次 open，随后 fork</text>
    <text x="28" y="85" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">父进程</text>
    <text x="330" y="85" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">文件对象</text>
    <text x="622" y="85" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">子进程</text>
    <rect x="28" y="111" width="230" height="112" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="44" y="143" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">描述符表</text>
    <text x="44" y="172" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">fd 3</text>
    <text x="44" y="199" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">fd 4</text>
    <rect x="622" y="111" width="230" height="112" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="638" y="143" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">描述符表</text>
    <text x="638" y="172" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">fd 3</text>
    <text x="638" y="199" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">fd 4</text>
    <rect x="330" y="111" width="220" height="112" rx="5" fill="#e4f0e6" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="346" y="143" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">对象 A</text>
    <text x="346" y="172" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">共享偏移 offset_A</text>
    <text x="346" y="199" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">权限、inode 引用</text>
    <rect x="330" y="265" width="220" height="112" rx="5" fill="#e4f0e6" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="346" y="297" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">对象 B</text>
    <text x="346" y="326" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">共享偏移 offset_B</text>
    <text x="346" y="353" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">权限、inode 引用</text>
    <rect x="330" y="419" width="220" height="112" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="346" y="451" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">同一 inode</text>
    <text x="346" y="480" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">文件大小、类型</text>
    <text x="346" y="507" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">数据块地址</text>
    <path d="M258 172 H318" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
    <path d="M622 172 H562" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
    <path d="M258 199 H284 V307 H318" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
    <path d="M622 199 H596 V307 H562" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
    <path d="M550 207 H573 V466 H562" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
    <path d="M440 377 V407" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
    <text x="28" y="552" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">A、B 各自保存偏移；虚线箭头表示父子进程共享的引用关系。</text>
  </g>
</svg>
