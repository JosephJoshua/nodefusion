<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" role="img" aria-labelledby="title desc">
  <title id="title">用户上下文与任务上下文</title>
  <desc id="desc">异常入口保存用户上下文，任务切换保存内核上下文。恢复时先恢复内核的 ra、sp 和 s0 到 s11，继续内核处理，再恢复用户寄存器并通过 sret 返回用户态。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linejoin="round"/></marker></defs>
  <rect width="880" height="450" fill="#fafbf8"/>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#243d35">
    <text x="28" y="38" font-size="24" font-weight="600" fill="#243d35" text-anchor="start">同一任务的两种上下文</text>
    <rect x="28" y="76" width="398" height="85" rx="5" fill="#e4f0e6" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="44" y="108" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">用户态执行</text>
    <text x="44" y="137" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">用户寄存器、用户栈、程序位置</text>
    <rect x="454" y="76" width="398" height="85" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="470" y="108" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">内核态执行</text>
    <text x="470" y="137" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">内核调用、内核栈、继续执行位置</text>
    <path d="M426 118 H442" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="28" y="192" font-size="18" font-weight="600" fill="#243d35" text-anchor="start">异常入口保存</text>
    <text x="454" y="192" font-size="18" font-weight="600" fill="#243d35" text-anchor="start">任务切换保存</text>
    <path d="M227 161 V216" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M653 161 V216" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="28" y="230" width="398" height="139" rx="5" fill="#e4f0e6" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="44" y="262" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">用户上下文</text>
    <text x="44" y="291" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">通用寄存器、sepc、sstatus</text>
    <text x="44" y="318" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">rCore：内核栈中的 TrapContext</text>
    <text x="44" y="345" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">uCore：静态分配的 trapframe</text>
    <rect x="454" y="230" width="398" height="139" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="470" y="262" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">内核切换上下文</text>
    <text x="470" y="291" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">ra、sp、s0 至 s11</text>
    <text x="470" y="318" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">保存于任务或进程控制块</text>
    <text x="470" y="345" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">uCore 调度器另有 idle.context</text>
    <text x="28" y="409" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">恢复内核上下文 → 继续内核调用 → 恢复用户上下文 → sret</text>
  </g>
</svg>
