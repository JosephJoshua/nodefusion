<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="title desc">
  <title id="title">进程与线程的资源关系</title>
  <desc id="desc">进程管理地址空间、文件描述符和同步对象。同一进程的多个线程共享这些资源，每个线程拥有独立用户栈、内核栈、异常上下文和任务上下文。包含框表示资源归属，虚线箭头表示线程引用进程。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linejoin="round"/></marker></defs>
  <rect width="880" height="480" fill="#fafbf8"/>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#243d35">
    <text x="28" y="38" font-size="24" font-weight="600" fill="#243d35" text-anchor="start">同一进程中的共享资源与线程私有状态</text>
    <rect x="28" y="70" width="824" height="170" rx="5" fill="#e4f0e6" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="46" y="103" font-size="22" font-weight="600" fill="#243d35" text-anchor="start">进程控制块 · PID</text>
    <rect x="46" y="123" width="248" height="98" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="62" y="155" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">地址空间</text>
    <text x="62" y="184" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">页表、全局变量、堆</text>
    <rect x="316" y="123" width="248" height="98" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="332" y="155" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">文件描述符表</text>
    <text x="332" y="184" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">打开的文件与管道</text>
    <rect x="586" y="123" width="248" height="98" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="602" y="155" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">同步对象</text>
    <text x="602" y="184" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">锁、信号量、条件变量</text>
    <rect x="28" y="312" width="260" height="143" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="44" y="344" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">线程 · TID 0</text>
    <text x="44" y="373" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">用户栈、内核栈</text>
    <text x="44" y="400" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">异常上下文、任务上下文</text>
    <text x="44" y="427" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">线程状态、退出码</text>
    <path d="M158 312 V253" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
    <rect x="310" y="312" width="260" height="143" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="326" y="344" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">线程 · TID 1</text>
    <text x="326" y="373" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">用户栈、内核栈</text>
    <text x="326" y="400" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">异常上下文、任务上下文</text>
    <text x="326" y="427" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">线程状态、退出码</text>
    <path d="M440 312 V253" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
    <rect x="592" y="312" width="260" height="143" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="608" y="344" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">线程 · TID 2</text>
    <text x="608" y="373" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">用户栈、内核栈</text>
    <text x="608" y="400" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">异常上下文、任务上下文</text>
    <text x="608" y="427" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">线程状态、退出码</text>
    <path d="M722 312 V253" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
    <text x="440" y="282" font-size="18" font-weight="400" fill="#52675e" text-anchor="middle">各线程引用同一进程</text>
  </g>
</svg>
