<svg xmlns="http://www.w3.org/2000/svg" width="880" height="472" viewBox="0 0 880 472" role="img" aria-labelledby="title desc">
  <title id="title">进程退出与资源回收</title>
  <desc id="desc">有父进程的子进程在 fork 后取得独立数据页。rCore 在 exit 时释放数据页，waitpid 移除最后一个强引用后回收页表、PID 和内核栈。uCore 在 exit 时回收数据页和页表页，waitpid 将槽位设为 UNUSED；静态内核栈和上下文可复用。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linejoin="round"/></marker></defs>
  <rect width="880" height="472" fill="#fafbf8"/>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#243d35">
    <text x="28" y="38" font-size="24" font-weight="600" fill="#243d35" text-anchor="start">子进程退出与资源回收</text>
    <text x="28" y="83" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">① fork 完成</text>
    <text x="316" y="83" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">② exit 完成</text>
    <text x="604" y="83" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">③ waitpid 成功</text>
    <text x="28" y="114" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">rCore</text>
    <text x="28" y="304" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">uCore</text>
    <rect x="28" y="130" width="248" height="139" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="44" y="162" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">建立子进程</text>
    <text x="44" y="191" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">独立数据页与页表</text>
    <text x="44" y="218" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">新 PID、动态内核栈</text>
    <text x="44" y="245" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">父进程持有子进程 Arc</text>
    <rect x="316" y="130" width="248" height="139" rx="5" fill="#f5eddc" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="332" y="162" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">成为 Zombie</text>
    <text x="332" y="191" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">释放用户数据页</text>
    <text x="332" y="218" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">保留页表、PID、内核栈</text>
    <text x="332" y="245" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">保存退出码</text>
    <rect x="604" y="130" width="248" height="139" rx="5" fill="#e4f0e6" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="620" y="162" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">移除最后一个强引用</text>
    <text x="620" y="191" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">取得退出码</text>
    <text x="620" y="218" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">回收页表、PID、内核栈</text>
    <text x="620" y="245" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">释放子进程控制块</text>
    <rect x="28" y="320" width="248" height="139" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="44" y="352" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">建立子进程</text>
    <text x="44" y="381" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">独立数据页与页表</text>
    <text x="44" y="408" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">分配进程槽与 PID</text>
    <text x="44" y="435" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">使用槽位对应的静态栈</text>
    <rect x="316" y="320" width="248" height="139" rx="5" fill="#f5eddc" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="332" y="352" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">成为 ZOMBIE</text>
    <text x="332" y="381" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">释放数据页和页表页</text>
    <text x="332" y="408" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">保留 PID、父指针</text>
    <text x="332" y="435" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">保存退出码</text>
    <rect x="604" y="320" width="248" height="139" rx="5" fill="#e4f0e6" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="620" y="352" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">进程槽恢复 UNUSED</text>
    <text x="620" y="381" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">取得退出码</text>
    <text x="620" y="408" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">进程槽可再次分配</text>
    <text x="620" y="435" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">静态栈与上下文可复用</text>
    <path d="M276 196 H304" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M564 196 H592" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M276 386 H304" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M564 386 H592" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  </g>
</svg>
