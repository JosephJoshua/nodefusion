<svg xmlns="http://www.w3.org/2000/svg" width="880" height="458" viewBox="0 0 880 458" role="img" aria-labelledby="title desc">
  <title id="title">管道的环形缓冲区</title>
  <desc id="desc">写端和读端共享环形缓冲区。未读区间从下一读取位置到下一写入位置，读写下标到数组末尾后回到零。满时写进程让出，空且还有写端时读进程让出。rCore 容量 32，uCore 容量 512。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linejoin="round"/></marker></defs>
  <rect width="880" height="458" fill="#fafbf8"/>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#243d35">
    <text x="28" y="38" font-size="24" font-weight="600" fill="#243d35" text-anchor="start">写入追加数据，读取按 FIFO 顺序取走数据</text>
    <rect x="28" y="76" width="188" height="85" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="44" y="108" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">写进程</text>
    <text x="44" y="137" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">通过写端写入</text>
    <rect x="320" y="76" width="240" height="85" rx="5" fill="#e4f0e6" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="336" y="108" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">环形缓冲区</text>
    <text x="336" y="137" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">读写端共同引用</text>
    <rect x="664" y="76" width="188" height="85" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="680" y="108" font-size="20" font-weight="600" fill="#243d35" text-anchor="start">读进程</text>
    <text x="680" y="137" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">通过读端读取</text>
    <path d="M216 119 H308" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M560 119 H652" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="28" y="200" font-size="18" font-weight="600" fill="#243d35" text-anchor="start">数组下标</text>
    <text x="178" y="200" font-size="18" font-weight="400" fill="#243d35" text-anchor="start">0</text>
    <text x="830" y="200" font-size="18" font-weight="400" fill="#243d35" text-anchor="end">N − 1</text>
    <rect x="178" y="214" width="150" height="60" rx="0" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="253.0" y="250" font-size="19" font-weight="600" fill="#243d35" text-anchor="middle">空闲</text>
    <rect x="328" y="214" width="300" height="60" rx="0" fill="#e4f0e6" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="478.0" y="250" font-size="19" font-weight="600" fill="#243d35" text-anchor="middle">未读数据</text>
    <rect x="628" y="214" width="224" height="60" rx="0" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="740.0" y="250" font-size="19" font-weight="600" fill="#243d35" text-anchor="middle">空闲</text>
    <path d="M328 310 V281" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="328" y="333" font-size="18" font-weight="400" fill="#243d35" text-anchor="middle">下一读取位置</text>
    <path d="M628 310 V281" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="628" y="333" font-size="18" font-weight="400" fill="#243d35" text-anchor="middle">下一写入位置</text>
    <path d="M852 275 V348 H178 V283" fill="none" stroke="#80623c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="515" y="371" font-size="18" font-weight="400" fill="#52675e" text-anchor="middle">下标到达末尾后，从 0 继续</text>
    <text x="28" y="409" font-size="18" font-weight="400" fill="#243d35" text-anchor="start">rCore：N = 32，head / tail；status 区分下标相等时的空与满。</text>
    <text x="28" y="440" font-size="18" font-weight="400" fill="#243d35" text-anchor="start">uCore：N = 512，nread % N / nwrite % N；计数差表示未读量。</text>
  </g>
</svg>
