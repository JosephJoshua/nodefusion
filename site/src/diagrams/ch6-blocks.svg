<svg xmlns="http://www.w3.org/2000/svg" width="880" height="454" viewBox="0 0 880 454" role="img" aria-labelledby="title desc">
  <title id="title">文件偏移与块索引</title>
  <desc id="desc">文件偏移除以块大小得到逻辑块号，余数为块内偏移。直接索引从 inode 取得数据块号，一级间接索引经过一个索引块，二级间接索引经过两个。rCore 支持三条路径，uCore 支持前两条。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linejoin="round"/></marker></defs>
  <rect width="880" height="454" fill="#fafbf8"/>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#243d35">
    <text x="28" y="38" font-size="24" font-weight="600" fill="#243d35" text-anchor="start">逻辑块号 = offset / 块大小</text>
    <text x="28" y="69" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">块内偏移 = offset % 块大小</text>
    <text x="28" y="148" font-size="19" font-weight="600" fill="#243d35" text-anchor="start">直接索引</text>
    <rect x="160" y="113" width="260" height="62" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="290.0" y="149" font-size="18" font-weight="600" fill="#243d35" text-anchor="middle">inode 直接地址</text>
    <rect x="646" y="113" width="206" height="62" rx="5" fill="#e4f0e6" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="749.0" y="149" font-size="18" font-weight="600" fill="#243d35" text-anchor="middle">数据块</text>
    <path d="M420 144 H636" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="28" y="242" font-size="19" font-weight="600" fill="#243d35" text-anchor="start">一级间接</text>
    <rect x="160" y="207" width="220" height="62" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="270.0" y="243" font-size="18" font-weight="600" fill="#243d35" text-anchor="middle">inode 间接地址</text>
    <rect x="416" y="207" width="194" height="62" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="513.0" y="243" font-size="18" font-weight="600" fill="#243d35" text-anchor="middle">一级间接块</text>
    <path d="M380 238 H406" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="646" y="207" width="206" height="62" rx="5" fill="#e4f0e6" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="749.0" y="243" font-size="18" font-weight="600" fill="#243d35" text-anchor="middle">数据块</text>
    <path d="M610 238 H636" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="28" y="336" font-size="19" font-weight="600" fill="#243d35" text-anchor="start">二级间接</text>
    <rect x="160" y="301" width="146" height="62" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="233.0" y="337" font-size="18" font-weight="600" fill="#243d35" text-anchor="middle">inode</text>
    <rect x="342" y="301" width="136" height="62" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="410.0" y="337" font-size="18" font-weight="600" fill="#243d35" text-anchor="middle">二级间接块</text>
    <path d="M306 332 H332" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="514" y="301" width="132" height="62" rx="5" fill="#f5f7f2" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="580.0" y="337" font-size="18" font-weight="600" fill="#243d35" text-anchor="middle">一级间接块</text>
    <path d="M478 332 H504" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="682" y="301" width="170" height="62" rx="5" fill="#e4f0e6" stroke="#8a9d92" stroke-width="1.4"/>
    <text x="767.0" y="337" font-size="18" font-weight="600" fill="#243d35" text-anchor="middle">数据块</text>
    <path d="M646 332 H672" fill="none" stroke="#52675e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="28" y="408" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">rCore：512 字节 / 块，27 个直接地址，每个间接块保存 128 个地址。</text>
    <text x="28" y="439" font-size="18" font-weight="400" fill="#52675e" text-anchor="start">uCore：1024 字节 / 块，12 个直接地址，每个间接块保存 256 个地址。</text>
  </g>
</svg>
