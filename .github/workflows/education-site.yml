name: 教学网站

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/education-site.yml
      - site/**
      - artifacts/**
      - nodefusion/**
      - scripts/build_education_site.py
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: 安装 mdBook 0.5.4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mdbook-bin"
          curl -fsSL --proto '=https' --tlsv1.2 \
            https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            -o "$RUNNER_TEMP/mdbook-v0.5.4.tar.gz"
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  $RUNNER_TEMP/mdbook-v0.5.4.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mdbook-v0.5.4.tar.gz" -C "$RUNNER_TEMP/mdbook-bin"
          "$RUNNER_TEMP/mdbook-bin/mdbook" --version
      - name: 检查章节与交互模型
        run: |
          python3 -m pip install 'pytest==9.0.2'
          python3 -m pytest nodefusion/tests/test_education_provenance.py nodefusion/tests/test_regenerate_artifact.py nodefusion/tests/test_artifact_sources.py nodefusion/tests/test_coverage_evidence.py nodefusion/tests/test_kernel_integrations.py site/tests -q
          node site/tests/switch.test.cjs
          node site/tests/blocks.test.cjs
          node site/tests/pipe.test.cjs
          node site/tests/sync.test.cjs
          node site/tests/comments.test.cjs
          node --check site/src/diagrams/sync.js
          node --check site/src/diagrams/sync-model.js
          node --check site/src/diagrams/explorer.js
      - name: 构建网站并检查链接与报告
        run: |
          python3 scripts/build_education_site.py \
            --mdbook "$RUNNER_TEMP/mdbook-bin/mdbook" \
            --dest-dir "$RUNNER_TEMP/education-site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/education-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
